name: PRODUCTION DEPLOYMENT PIPELINE

on:
  push:
    branches: [release/production]
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to deploy (leave empty to deploy latest commit)"
        required: false
        type: string
      skip_tests:
        description: "Skip test execution (not recommended)"
        required: false
        type: boolean
        default: false

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  NODE_VERSION: "latest"
  DEPLOY_PATH: "/var/www/sb-web-helper"
  ARTIFACT_NAME: "production-build"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ============================================
  # 1. Pre-flight Checks
  # ============================================
  pre_flight_checks:
    name: Pre-flight Checks
    runs-on: [self-hosted, PRODUCTION-SB-WEB-HELPER]
    timeout-minutes: 5
    environment: production
    outputs:
      deployment_ref: ${{ steps.ref.outputs.ref }}
      deployment_sha: ${{ steps.ref.outputs.sha }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Determine Deployment Reference
        id: ref
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            REF="${{ inputs.tag }}"
            SHA=$(git rev-parse "refs/tags/${{ inputs.tag }}")
          else
            REF="${{ github.ref_name }}"
            SHA="${{ github.sha }}"
          fi
          echo "ref=${REF}" >> $GITHUB_OUTPUT
          echo "sha=${SHA}" >> $GITHUB_OUTPUT

      - name: Validate Deploy Directory
        run: mkdir -p "${{ env.DEPLOY_PATH }}"

      - name: Job Summary
        if: always()
        run: |
          echo "## Pre-flight Checks" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| Trigger | \`${{ github.event_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Actor | \`${{ github.actor }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | \`${{ github.ref_name }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit SHA | \`${{ github.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy Path | \`${{ env.DEPLOY_PATH }}\` |" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # 2. Build
  # ============================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [pre_flight_checks]
    if: |
      always() &&
      needs.pre_flight_checks.result == 'success'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5
        with:
          ref: ${{ needs.pre_flight_checks.outputs.deployment_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install Dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Generate Prisma Client
        run: |
          if [ -f "prisma/schema.prisma" ]; then npx prisma generate --schema=prisma/schema.prisma; fi
          if [ -f "prisma/timesheet/schema.prisma" ]; then npx prisma generate --schema=prisma/timesheet/schema.prisma; fi

      - name: Build Application
        run: npm run build

      - name: Pack Artifacts
        run: |
          tar -czf artifact.tar.gz .next public package.json package-lock.json next.config.mjs prisma

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.ARTIFACT_NAME }}
          retention-days: 1
          path: artifact.tar.gz

      - name: Job Summary
        if: always()
        run: |
          echo "## Build" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| Node.js Version | \`${{ env.NODE_VERSION }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact Name | \`${{ env.ARTIFACT_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit SHA | \`${{ needs.pre_flight_checks.outputs.deployment_sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact Retention | \`1 day\` |" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # 3. Deploy to Production
  # ============================================
  deploy:
    name: Deploy to Production
    runs-on: [self-hosted, PRODUCTION-SB-WEB-HELPER]
    needs: [pre_flight_checks, build]
    environment:
      name: production
      url: https://sb-helper.schoolbright.co

    steps:
      - name: Prepare Deployment Directory
        run: |
          echo "Cleaning deployment path: ${{ env.DEPLOY_PATH }}"
          sudo mkdir -p "${{ env.DEPLOY_PATH }}"
          sudo chown -R $USER:$USER "${{ env.DEPLOY_PATH }}"
          cd "${{ env.DEPLOY_PATH }}"
          rm -rf *

      - name: Download Build Artifacts
        uses: actions/download-artifact@v5
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.DEPLOY_PATH }}

      - name: Extract Artifacts
        run: |
          cd "${{ env.DEPLOY_PATH }}"
          echo "Extracting artifact archive..."
          tar -xzf artifact.tar.gz
          rm artifact.tar.gz

          if [ -d ".next" ]; then
            echo ".next directory verified."
          else
            echo "ERROR: .next directory is missing after extraction."
            exit 1
          fi

      - name: Install Production Dependencies
        run: |
          cd "${{ env.DEPLOY_PATH }}"

          echo "Installing production dependencies..."
          npm ci --omit=dev --legacy-peer-deps --prefer-offline --no-audit

          echo "Installing Prisma CLI..."
          npm install --no-save --legacy-peer-deps prisma

          echo "Regenerating Prisma client for target OS..."
          if [ -f "prisma/schema.prisma" ]; then npx prisma generate --schema=prisma/schema.prisma; fi
          if [ -f "prisma/timesheet/schema.prisma" ]; then npx prisma generate --schema=prisma/timesheet/schema.prisma; fi

          echo "Setting file permissions..."
          sudo chown -R root:root "${{ env.DEPLOY_PATH }}"
          sudo chmod -R 755 "${{ env.DEPLOY_PATH }}"

      - name: Restart Service
        run: |
          sudo systemctl restart sb-web-helper.service
          sleep 5
          if sudo systemctl is-active --quiet sb-web-helper.service; then
            echo "Service is active."
          else
            echo "ERROR: Service failed to start."
            sudo journalctl -u sb-web-helper.service -n 20 --no-pager
            exit 1
          fi

      - name: Job Summary
        if: always()
        run: |
          echo "## Deploy to Production" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Parameter | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| Deploy Path | \`${{ env.DEPLOY_PATH }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | \`${{ env.ARTIFACT_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Deployment Ref | \`${{ needs.pre_flight_checks.outputs.deployment_ref }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Service | \`sb-web-helper.service\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Environment URL | https://sb-helper.schoolbright.co |" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # 4. Verification
  # ============================================
  verify:
    name: Verify
    runs-on: [self-hosted, PRODUCTION-SB-WEB-HELPER]
    needs: deploy
    steps:
      - name: HTTP Health Check
        id: health
        run: |
          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}\n" http://localhost:3000 || echo "FAILED")
          echo "status=${HTTP_STATUS}" >> $GITHUB_OUTPUT
          if [ "$HTTP_STATUS" == "200" ]; then
            echo "Health check passed. HTTP 200."
          else
            echo "Health check returned: ${HTTP_STATUS}"
          fi

      - name: Job Summary
        if: always()
        run: |
          HTTP_STATUS="${{ steps.health.outputs.status }}"
          if [ "$HTTP_STATUS" == "200" ]; then
            RESULT="PASSED"
          else
            RESULT="FAILED (HTTP ${HTTP_STATUS})"
          fi

          echo "## Verification" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Result |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| HTTP Health Check | \`${RESULT}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Endpoint | \`http://localhost:3000\` |" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # 5. Deployment Summary
  # ============================================
  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [pre_flight_checks, build, deploy, verify]
    if: always()
    steps:
      - name: Generate Summary Report
        run: |
          get_status_label() {
            case "$1" in
              success)   echo "SUCCESS" ;;
              failure)   echo "FAILED" ;;
              cancelled) echo "CANCELLED" ;;
              skipped)   echo "SKIPPED" ;;
              *)         echo "UNKNOWN" ;;
            esac
          }

          PRE_FLIGHT=$(get_status_label "${{ needs.pre_flight_checks.result }}")
          BUILD=$(get_status_label "${{ needs.build.result }}")
          DEPLOY=$(get_status_label "${{ needs.deploy.result }}")
          VERIFY=$(get_status_label "${{ needs.verify.result }}")

          echo "## Production Deployment Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status | Details |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| Pre-flight Checks | \`${PRE_FLIGHT}\` | Ref: \`${{ needs.pre_flight_checks.outputs.deployment_ref }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Artifact | \`${BUILD}\` | Node v${{ env.NODE_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Production Deploy | \`${DEPLOY}\` | Path: \`${{ env.DEPLOY_PATH }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Health Check | \`${VERIFY}\` | https://sb-helper.schoolbright.co |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** \`${{ github.actor }}\` via \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Deployment Time:** $(date '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
