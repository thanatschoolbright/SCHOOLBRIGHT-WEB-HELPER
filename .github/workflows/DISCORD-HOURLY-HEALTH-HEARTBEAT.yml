name: HEALTH CHECK - HOURLY

on:
    schedule:
        # รันทุกชั่วโมง (0 นาที ของทุกชั่วโมง)
        - cron: "0 * * * *"

    # เปิดให้รัน manual ได้
    workflow_dispatch:

jobs:
    health-check:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Send Health Check Request
              run: |
                  echo "Sending health check request..."
                  response=$(curl -s -o /dev/null -w "%{http_code}" \
                    -X POST \
                    -H "Content-Type: application/json" \
                    -d '{"mode":"discord"}' \
                    "https://sb-helper.schoolbright.co/api/v1/health-check/server/system")

                  echo "HTTP Status: $response"

                  if [ "$response" -eq 200 ]; then
                    echo "✅ Health check successful"
                    exit 0
                  else
                    echo "❌ Health check failed with status: $response"
                    exit 1
                  fi

            - name: Log timestamp
              if: always()
              run: |
                  echo "Executed at: $(date)"
                  echo "Timezone: $(date +%Z)"
