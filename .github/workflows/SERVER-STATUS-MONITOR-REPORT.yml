name: 🏥 Server Status Monitoring - Multi-Channel Report

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  TZ: "Asia/Bangkok"
  TARGET_URL_DISCORD: "https://sb-helper.schoolbright.co/api/v2/server/status"
  TARGET_URL_EMAIL: "https://sb-helper.schoolbright.co/api/v2/server/status/channel/email"
  MAX_RETRIES: 3
  RETRY_DELAY: 5
  REQUEST_TIMEOUT: 30

on:
  schedule:
    - cron: "*/5 * * * *" # Every 5 minute
  workflow_dispatch:
    inputs:
      verbose:
        description: "Enable verbose logging"
        required: false
        default: "false"

concurrency:
  group: health-check-monitor
  cancel-in-progress: false

jobs:
  health-check-monitor:
    name: 🩺 Server Health Monitor
    runs-on: ubuntu-latest

    steps:
      # ============================================================
      # PHASE 1: INITIALIZATION & PREPARATION
      # ============================================================
      - name: ⏱️ Initialize Job
        id: init
        run: |
          JOB_START=$(date +%s)
          START_TIME=$(date '+%Y-%m-%d %H:%M:%S %Z')
          echo "job_start=$JOB_START" >> $GITHUB_OUTPUT
          echo "start_time=$START_TIME" >> $GITHUB_OUTPUT
          mkdir -p logs artifacts
          echo "✅ Job Execution Details: $START_TIME"

      # ============================================================
      # PHASE 2: DISCORD STATUS REPORT
      # ============================================================
      - name: 📡 Send Status Report to Discord
        id: discord_api
        continue-on-error: true
        run: |
          echo "Sending server status report to Discord..."
          ATTEMPT=0
          MAX_RETRIES=${{ env.MAX_RETRIES }}
          while [ $ATTEMPT -lt $MAX_RETRIES ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "🔄 Attempt $ATTEMPT/$MAX_RETRIES..."
            HTTP_CODE=$(curl -s -o /tmp/discord_response.json -w "%{http_code}" \
              --max-time ${{ env.REQUEST_TIMEOUT }} \
              -X POST \
              -H "Content-Type: application/json" \
              -d '{"mode":"discord"}' \
              "${{ env.TARGET_URL_DISCORD }}")

            echo "   HTTP Code: $HTTP_CODE"
            if [ "$HTTP_CODE" -eq 200 ] || [ "$HTTP_CODE" -eq 201 ]; then
              echo "✅ Success on attempt $ATTEMPT"
              echo "http_code=$HTTP_CODE" >> $GITHUB_OUTPUT
              exit 0
            fi
            [ $ATTEMPT -lt $MAX_RETRIES ] && sleep ${{ env.RETRY_DELAY }}
          done
          exit 1

      # ============================================================
      # PHASE 3: EMAIL STATUS REPORT
      # ============================================================
      - name: 📧 Send Status Report via Email
        id: email_api
        continue-on-error: true
        run: |
          echo "Sending server status report via Email..."
          ATTEMPT=0
          MAX_RETRIES=${{ env.MAX_RETRIES }}
          while [ $ATTEMPT -lt $MAX_RETRIES ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "🔄 Attempt $ATTEMPT/$MAX_RETRIES..."
            HTTP_CODE=$(curl -s -o /tmp/email_response.json -w "%{http_code}" \
              --max-time ${{ env.REQUEST_TIMEOUT }} \
              -X GET \
              "${{ env.TARGET_URL_EMAIL }}")

            echo "   HTTP Code: $HTTP_CODE"
            if [ "$HTTP_CODE" -eq 200 ] || [ "$HTTP_CODE" -eq 201 ]; then
              echo "✅ Success on attempt $ATTEMPT"
              echo "http_code=$HTTP_CODE" >> $GITHUB_OUTPUT
              exit 0
            fi
            [ $ATTEMPT -lt $MAX_RETRIES ] && sleep ${{ env.RETRY_DELAY }}
          done
          exit 1

      # ============================================================
      # PHASE 4: GITHUB ACTIONS SUMMARY
      # ============================================================
      - name: 📑 Publish Workflow Summary
        if: always()
        run: |
          {
            echo "### 🏥 Server Health Status Summary"
            echo ""
            echo "| Channel | Status | Outcome |"
            echo "| :--- | :---: | :--- |"
            
            # Discord
            if [ "${{ steps.discord_api.outcome }}" == "success" ]; then
              echo "| 🎮 Discord | ✅ | Success |"
            else
              echo "| 🎮 Discord | ❌ | Failed (\`${{ steps.discord_api.outputs.http_code }}\`) |"
            fi
            
            # Email
            if [ "${{ steps.email_api.outcome }}" == "success" ]; then
              echo "| 📧 Email | ✅ | Success |"
            else
              echo "| 📧 Email | ❌ | Failed (\`${{ steps.email_api.outputs.http_code }}\`) |"
            fi
            
            echo ""
            echo "Executed at: \`$(date '+%Y-%m-%d %H:%M:%S %Z')\`"
          } >> $GITHUB_STEP_SUMMARY
