name: 🚀 Release Production

on:
  push:
    branches: [release/production]
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to deploy (optional). If empty, uses the selected ref in the UI or the commit that triggered the run"
        required: false

jobs:
  pre-check:
    name: 🧾 Pre-Deployment Check
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: "🔑 Test SSH Connection"
        run: |
          echo "👉 Testing SSH connection to production server..."
          if sshpass -p "${{ secrets.HUAWEI_CLOUD_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.HUAWEI_CLOUD_USERNAME }}@${{ secrets.HUAWEI_CLOUD_HOST }} "echo '✅ SSH Success'"; then
            echo "✅ SSH connection established"
          else
            echo "❌ SSH connection failed" && exit 1
          fi

  build:
    name: "🔨 Build Project"
    needs: pre-check
    runs-on: ubuntu-latest
    steps:
      - name: "📥 Checkout Code"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}
      - name: "ℹ️ Log Ref Used" # yamllint disable-line rule:line-length
        run: |
          echo "👉 Determining ref..."
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.tag }}" != "" ]]; then
            echo "👉 Using ref: refs/tags/${{ inputs.tag }}"
          else
            echo "👉 Using ref: ${{ github.ref }}"
          fi

      - name: "⚙️ Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: "📦 Install Dependencies"
        run: |
          echo "👉 Installing dependencies with npm ci..."
          npm ci

      - name: "⚙️ Prisma Generate"
        run: |
          echo "👉 Generating Prisma client..."
          npx prisma generate --schema=prisma/schema.prisma
          npx prisma generate --schema=prisma/timesheet/schema.prisma

      - name: "🏗️ Build Project"
        run: |
          echo "👉 Building project..."
          npm run build

      - name: "📤 Archive Build Artifacts"
        run: |
          echo "👉 Archiving build artifacts into build.zip..."
          zip -r build.zip \
            .next \
            public \
            generated/prisma \
            generated/prisma-timesheet \
            package.json \
            package-lock.json \
            next.config.mjs

      - name: "⬆️ Upload Artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: build.zip

      - name: "✅ Confirm Upload"
        run: echo "✅ Build artifacts uploaded successfully"

  deploy:
    name: "🚚 Deploy to Server"
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: "📥 Download Artifacts"
        uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: "✅ Verify Artifact"
        run: |
          echo "👉 Verifying build.zip artifact..."
          if test -f build.zip; then
            echo "✅ build.zip exists"
          else
            echo "❌ build.zip missing" && exit 1
          fi

      - name: "🛑 Stop Service Before Deployment"
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.HUAWEI_CLOUD_HOST }}
          username: ${{ secrets.HUAWEI_CLOUD_USERNAME }}
          password: ${{ secrets.HUAWEI_CLOUD_PASSWORD }}
          port: ${{ secrets.HUAWEI_CLOUD_SSH_PORT }}
          script: |
            echo "👉 Stopping sb-web-helper.service..."
            sudo systemctl stop sb-web-helper.service || echo "⚠️ Service was not running or failed to stop"

      - name: "🗑️ Clean Old Deployment"
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.HUAWEI_CLOUD_HOST }}
          username: ${{ secrets.HUAWEI_CLOUD_USERNAME }}
          password: ${{ secrets.HUAWEI_CLOUD_PASSWORD }}
          port: ${{ secrets.HUAWEI_CLOUD_SSH_PORT }}
          script: |
            echo "👉 Removing old deployment files from /var/www/sb-web-helper..."
            rm -rf /var/www/sb-web-helper/*

      - name: "🔐 Upload Artifact via SCP"
        uses: appleboy/scp-action@v0.1.5
        with:
          host: ${{ secrets.HUAWEI_CLOUD_HOST }}
          username: ${{ secrets.HUAWEI_CLOUD_USERNAME }}
          password: ${{ secrets.HUAWEI_CLOUD_PASSWORD }}
          port: ${{ secrets.HUAWEI_CLOUD_SSH_PORT }}
          source: "build.zip"
          target: "/var/www/sb-web-helper"

      - name: "🗜️ Deploy & Install"
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.HUAWEI_CLOUD_HOST }}
          username: ${{ secrets.HUAWEI_CLOUD_USERNAME }}
          password: ${{ secrets.HUAWEI_CLOUD_PASSWORD }}
          port: ${{ secrets.HUAWEI_CLOUD_SSH_PORT }}
          script: |
            cd /var/www/sb-web-helper
            echo "👉 Extracting build.zip..."
            unzip -o build.zip
            echo "👉 Installing production dependencies with npm ci --only=production..."
            npm ci --only=production
            echo "👉 Pruning unnecessary packages..."
            npm prune --production
            echo "👉 Restarting sb-web-helper.service..."
            sudo systemctl restart sb-web-helper.service
            echo "👉 Checking service status..."
            sudo systemctl status sb-web-helper.service --no-pager
            echo "✅ Deployment completed!"
