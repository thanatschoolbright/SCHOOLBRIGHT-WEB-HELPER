name: Production Deployment Pipeline

on:
  push:
    branches: [release/production]
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to deploy (leave empty to deploy latest commit)"
        required: false
        type: string
      skip_tests:
        description: "Skip test execution (not recommended)"
        required: false
        type: boolean
        default: false

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  NODE_VERSION: "20"
  BUN_VERSION: "latest"
  DEPLOY_PATH: "/var/www/sb-web-helper"
  ARTIFACT_NAME: "production-build"
  ARTIFACT_RETENTION_DAYS: 30

jobs:
  # ============================================
  # Pre-deployment Validation
  # ============================================
  pre_flight_checks:
    name: 🔍 Pre-flight Checks
    runs-on: [self-hosted, PRODUCTION-SB-WEB-HELPER]
    timeout-minutes: 5
    environment:
      name: production
    outputs:
      deployment_ref: ${{ steps.ref.outputs.ref }}
      deployment_sha: ${{ steps.ref.outputs.sha }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Determine Deployment Reference
        id: ref
        run: |
          echo "🔵 [DEBUG] Starting Reference Determination..."
          echo "   - Event Name: ${{ github.event_name }}"
          echo "   - Input Tag: ${{ inputs.tag }}"

          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            echo "   - Mode: Manual Tag Deployment"
            REF="${{ inputs.tag }}"
            SHA=$(git rev-parse "refs/tags/${{ inputs.tag }}")
          else
            echo "   - Mode: Automatic/Branch Deployment"
            REF="${{ github.ref_name }}"
            SHA="${{ github.sha }}"
          fi

          echo "ref=${REF}" >> $GITHUB_OUTPUT
          echo "sha=${SHA}" >> $GITHUB_OUTPUT

          echo "✅ [RESULT] Reference Determined:"
          echo "   - Ref: ${REF}"
          echo "   - SHA: ${SHA:0:8}"

      - name: Validate Deployment Directory
        timeout-minutes: 2
        run: |
          echo "🔵 [DEBUG] Checking Deployment Path: ${{ env.DEPLOY_PATH }}"

          if [ ! -d "${{ env.DEPLOY_PATH }}" ]; then
            echo "⚠️ [WARN] Directory does not exist. Attempting to create..."
            mkdir -p "${{ env.DEPLOY_PATH }}"
            
            if [ -d "${{ env.DEPLOY_PATH }}" ]; then
               echo "✅ [SUCCESS] Directory created successfully."
            else
               echo "❌ [ERROR] Failed to create directory."
               exit 1
            fi
          else
            echo "✅ [INFO] Directory exists. Checking permissions..."
            ls -ld "${{ env.DEPLOY_PATH }}"
          fi

  # ============================================
  # Code Quality & Security
  # ============================================
  quality-gates:
    name: 🛡️ Quality & Security Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: pre_flight_checks
    if: ${{ !inputs.skip_tests }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.pre_flight_checks.outputs.deployment_sha }}

      - name: Install Dependencies
        run: |
          echo "🔵 [DEBUG] Installing dependencies for quality checks..."
          npm ci --prefer-offline --no-audit
          echo "✅ [SUCCESS] Dependencies installed."

      - name: Lint Code
        run: |
          echo "🔵 [DEBUG] Checking for lint script..."
          if [ -f "package.json" ] && npm run --silent | grep -q "lint"; then
            echo "📝 [ACTION] Running linter..."
            npm run lint
            echo "✅ [SUCCESS] Lint checks passed."
          else
            echo "⚠️ [SKIP] No 'lint' script found in package.json."
          fi

      - name: Run Tests
        run: |
          echo "🔵 [DEBUG] Checking for test script..."
          if [ -f "package.json" ] && npm run --silent | grep -q "test"; then
            echo "🧪 [ACTION] Running tests..."
            npm test
            echo "✅ [SUCCESS] All tests passed."
          else
            echo "⚠️ [SKIP] No 'test' script found in package.json."
          fi

      - name: Security Audit
        continue-on-error: true
        run: |
          echo "🔒 [ACTION] Running security audit (Level: High)..."
          npm audit --audit-level=high || echo "⚠️ [WARN] Security vulnerabilities detected (Non-blocking)"

  # ============================================
  # Build Application
  # ============================================
  build:
    name: 🔨 Build Application
    runs-on: [self-hosted, PRODUCTION-SB-WEB-HELPER]
    timeout-minutes: 120
    needs: [pre_flight_checks]

    steps:
      - name: Fix Workspace Permissions
        run: |
          echo "🔵 [DEBUG] Fixing workspace permissions..."
          echo "   - Target: ${GITHUB_WORKSPACE%/*}"
          sudo chown -R githubrunner:githubrunner "${GITHUB_WORKSPACE%/*}" || true
          sudo chmod -R u+rwX "${GITHUB_WORKSPACE%/*}" || true
          echo "✅ [INFO] Permissions applied."

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.pre_flight_checks.outputs.deployment_sha }}

      - name: Verify Environment
        run: |
          echo "🔵 [DEBUG] Environment Verification:"
          echo "   - Node Version: $(node -v)"
          echo "   - NPM Version: $(npm -v)"
          echo "   - Bun Version: $(bun --version)"
          echo "   - Workspace: ${{ github.workspace }}"

      - name: Install Dependencies
        run: |
          echo "📦 [ACTION] Installing dependencies (npm ci)..."
          npm ci --prefer-offline --no-audit
          echo "✅ [SUCCESS] Dependencies installed."

      - name: Generate Prisma Client
        run: |
          echo "⚙️ [DEBUG] Checking for Prisma schemas..."

          if [ -f "prisma/schema.prisma" ]; then
            echo "   - Found: prisma/schema.prisma -> Generating..."
            bun x prisma generate --schema=prisma/schema.prisma
          else
             echo "   - Missing: prisma/schema.prisma"
          fi

          if [ -f "prisma/timesheet/schema.prisma" ]; then
            echo "   - Found: prisma/timesheet/schema.prisma -> Generating..."
            bun x prisma generate --schema=prisma/timesheet/schema.prisma
          else
             echo "   - Missing: prisma/timesheet/schema.prisma"
          fi

          echo "✅ [SUCCESS] Prisma generation phase complete."

      - name: Build Application (NPM)
        run: |
          echo "🏗️ [ACTION] Starting Next.js Build..."
          echo "   - Command: npm run build"
          npm run build
          echo "✅ [SUCCESS] Build process finished."

      - name: Verify Build Output
        run: |
          echo "🔍 [DEBUG] Verifying .next directory..."
          if [ ! -d ".next" ]; then
            echo "❌ [ERROR] Build output (.next) NOT found!"
            exit 1
          else
            SIZE=$(du -sh .next | cut -f1)
            echo "✅ [SUCCESS] Build output verified. Size: $SIZE"
            ls -F .next | head -n 5
          fi

  # ============================================
  # Deploy to Production
  # ============================================
  # ============================================
  # Deploy to Production
  # ============================================
  deploy:
    name: 🚀 Deploy to Production
    runs-on: [self-hosted, PRODUCTION-SB-WEB-HELPER]
    timeout-minutes: 20
    needs: [pre_flight_checks, build]
    environment:
      name: production
      url: https://sb-helper.schoolbright.co

    steps:
      - name: Prepare Deployment
        run: |
          set -e
          echo "🔧 [ACTION] Preparing deployment directory: $DEPLOY_PATH"

          # Prepare deployment directory
          echo "   - Checking existence..."
          sudo mkdir -p "$DEPLOY_PATH"
          cd "$DEPLOY_PATH"

          # Clean old files
          echo "🧹 [ACTION] Cleaning old files (Preserving .env)..."
          sudo find . -mindepth 1 ! -name '.env' -delete

          echo "   - Remaining files:"
          ls -la
          echo "✅ [SUCCESS] Directory prepared."

      - name: Copy Build Files
        run: |
          set -e
          echo "📦 [ACTION] Copying build artifacts..."

          # ✅ FIX: ใช้ $GITHUB_WORKSPACE และ $DEPLOY_PATH แทน 
          echo "   - Copying .next folder..."
          sudo cp -r "$GITHUB_WORKSPACE/.next" "$DEPLOY_PATH/"

          echo "   - Copying public folder..."
          sudo cp -r "$GITHUB_WORKSPACE/public" "$DEPLOY_PATH/"

          echo "   - Checking for Prisma generated files..."
          if [ -d "$GITHUB_WORKSPACE/generated/prisma" ]; then
            echo "     > Found prisma generated files. Copying..."
            sudo mkdir -p "$DEPLOY_PATH/generated"
            sudo cp -r "$GITHUB_WORKSPACE/generated/prisma" "$DEPLOY_PATH/generated/"
          fi

          if [ -d "$GITHUB_WORKSPACE/generated/prisma-timesheet" ]; then
            echo "     > Found prisma-timesheet generated files. Copying..."
            sudo mkdir -p "$DEPLOY_PATH/generated"
            sudo cp -r "$GITHUB_WORKSPACE/generated/prisma-timesheet" "$DEPLOY_PATH/generated/"
          fi

          echo "   - Copying Config files (package.json, locks, next.config)..."
          sudo cp "$GITHUB_WORKSPACE/package.json" "$DEPLOY_PATH/"
          sudo cp "$GITHUB_WORKSPACE/package-lock.json" "$DEPLOY_PATH/"
          sudo cp "$GITHUB_WORKSPACE/next.config.mjs" "$DEPLOY_PATH/"

          echo "✅ [SUCCESS] All files copied."

      - name: Deploy Application
        run: |
          set -e
          # ✅ FIX: ใช้ $DEPLOY_PATH
          cd "$DEPLOY_PATH"

          echo "📦 [ACTION] Installing Production Dependencies..."
          echo "   - Path: $(pwd)"

          if sudo npm ci --omit=dev --prefer-offline --no-audit; then
             echo "   > Standard install successful."
          else
             echo "⚠️ [WARN] Standard install failed. Retrying with --legacy-peer-deps..."
             sudo npm ci --omit=dev --legacy-peer-deps --prefer-offline --no-audit
          fi

          # Verify critical dependencies
          echo "🔍 [DEBUG] Verifying node_modules..."
          if [ ! -d "node_modules" ] || [ ! -f "node_modules/next/dist/bin/next" ]; then
            echo "❌ [ERROR] Critical dependencies missing (Next.js binary not found)!"
            exit 1
          fi

          echo "🔐 [ACTION] Setting file permissions (www-data)..."
          sudo chown -R www-data:www-data "$DEPLOY_PATH" || true

          echo "🔄 [ACTION] Restarting Systemd Service: sb-web-helper.service..."
          sudo systemctl restart sb-web-helper.service
          echo "   - Restart command sent."

          # Wait for service to initialize
          echo "⏳ [WAIT] Waiting 5s for initialization..."
          sleep 5

          # Health check with retries
          MAX_RETRIES=6
          RETRY_COUNT=0

          echo "💓 [ACTION] Starting Health Check..."
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if sudo systemctl is-active --quiet sb-web-helper.service; then
              echo "✅ [SUCCESS] Service is ACTIVE."
              break
            fi
            
            RETRY_COUNT=$((RETRY_COUNT + 1))
            echo "⚠️ [RETRY] Service not ready yet ($RETRY_COUNT/$MAX_RETRIES). Waiting 5s..."
            
            if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
              echo "❌ [ERROR] Service failed health check after ${MAX_RETRIES} attempts."
              echo "📋 [LOGS] Recent System Logs:"
              sudo journalctl -u sb-web-helper.service -n 30 --no-pager
              exit 1
            fi
            
            sleep 5
          done

          echo "✅ [COMPLETE] Deployment Logic Finished."
  # ============================================
  # Post-deployment Verification
  # ============================================
  verify:
    name: ✅ Post-deployment Verification
    runs-on: [self-hosted, PRODUCTION-SB-WEB-HELPER]
    timeout-minutes: 5
    needs: [deploy, pre_flight_checks]
    environment:
      name: production

    steps:
      - name: Verify Service Status
        run: |
          set -e
          echo "🔍 [ACTION] Performing Post-Deployment Verification..."

          # Check service status
          echo "   - Checking systemctl status..."
          if ! sudo systemctl is-active --quiet sb-web-helper.service; then
            echo "❌ [ERROR] Service is NOT running!"
            exit 1
          fi
          echo "   > Service is Active."

          # Check if application is responding
          echo "   - Checking HTTP Response (localhost:3000)..."
          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}\n" http://localhost:3000 || echo "FAILED")

          if [ "$HTTP_STATUS" == "200" ]; then
             echo "✅ [SUCCESS] Application responded with HTTP 200."
          else
             echo "⚠️ [WARN] Application responded with HTTP $HTTP_STATUS (Expected 200)."
          fi

          # Display service info
          echo "📊 [INFO] Service Details:"
          sudo systemctl status sb-web-helper.service --no-pager -l | head -n 15

          echo "✅ [COMPLETE] Verification passed."

      - name: Deployment Summary
        run: |
          echo "============================================"
          echo "🎉 DEPLOYMENT SUCCESSFUL"
          echo "============================================"
          echo "📍 Reference: ${{ needs.pre_flight_checks.outputs.deployment_ref }}"
          echo "🔖 Commit: ${{ needs.pre_flight_checks.outputs.deployment_sha }}"
          echo "🕐 Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "============================================"
