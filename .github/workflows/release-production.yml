name: Production Deployment Pipeline

on:
  push:
    branches: [release/production]
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to deploy (leave empty to deploy latest commit)"
        required: false
        type: string
      skip_tests:
        description: "Skip test execution (not recommended)"
        required: false
        type: boolean
        default: false

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  DEPLOY_PATH: "/var/www/sb-web-helper"
  ARTIFACT_NAME: "production-build"

jobs:
  # ============================================
  # 1. Pre-flight Checks
  # ============================================
  pre_flight_checks:
    name: 🔍 Pre-flight Checks
    runs-on: [self-hosted, PRODUCTION-SB-WEB-HELPER]
    timeout-minutes: 5
    environment: production
    outputs:
      deployment_ref: ${{ steps.ref.outputs.ref }}
      deployment_sha: ${{ steps.ref.outputs.sha }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Determine Deployment Reference
        id: ref
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            REF="${{ inputs.tag }}"
            SHA=$(git rev-parse "refs/tags/${{ inputs.tag }}")
          else
            REF="${{ github.ref_name }}"
            SHA="${{ github.sha }}"
          fi
          echo "ref=${REF}" >> $GITHUB_OUTPUT
          echo "sha=${SHA}" >> $GITHUB_OUTPUT

      - name: Validate Directory
        run: mkdir -p "${{ env.DEPLOY_PATH }}"

  # ============================================
  # 2. Quality & Security
  # ============================================
  quality-gates:
    name: 🛡️ Quality & Security
    runs-on: ubuntu-latest
    needs: pre_flight_checks
    if: ${{ !inputs.skip_tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.pre_flight_checks.outputs.deployment_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci --prefer-offline --no-audit
      - run: if npm run --silent | grep -q "lint"; then npm run lint; fi
      - run: if npm run --silent | grep -q "test"; then npm test; fi
      - run: npm audit --audit-level=high || echo "⚠️ Audit warning"

  # ============================================
  # 3. Build & Deploy on Server (Optimized)
  # ============================================
  deploy:
    name: 🚀 Build & Deploy on Server
    runs-on: [self-hosted, PRODUCTION-SB-WEB-HELPER]
    needs: [pre_flight_checks, quality-gates]
    if: |
      always() &&
      (needs.quality-gates.result == 'success' || needs.quality-gates.result == 'skipped') &&
      needs.pre_flight_checks.result == 'success'
    environment:
      name: production
      url: https://sb-helper.schoolbright.co

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.pre_flight_checks.outputs.deployment_sha }}

      - name: Sync to Deploy Path
        run: |
          sudo mkdir -p "${{ env.DEPLOY_PATH }}"
          sudo chown -R $USER:$USER "${{ env.DEPLOY_PATH }}"
          # Sync code while preserving .env and excluding old build/modules
          rsync -avz --exclude '.git' --exclude '.next' --exclude 'node_modules' ./ "${{ env.DEPLOY_PATH }}/"

      - name: Build Application on Server
        run: |
          # Load NVM/Node environment
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

          cd "${{ env.DEPLOY_PATH }}"

          echo "📦 Installing All Dependencies..."
          npm ci --legacy-peer-deps --prefer-offline --no-audit

          echo "⚙️ Generating Prisma Clients..."
          if [ -f "prisma/schema.prisma" ]; then npx prisma generate --schema=prisma/schema.prisma; fi
          if [ -f "prisma/timesheet/schema.prisma" ]; (npx prisma generate --schema=prisma/timesheet/schema.prisma); fi

          echo "🔨 Building Next.js..."
          npm run build

          echo "🗑️ Cleaning devDependencies..."
          npm prune --production

      - name: Restart Service (PM2)
        run: |
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"

          cd "${{ env.DEPLOY_PATH }}"

          if pm2 show sb-web-helper > /dev/null 2>&1; then
            pm2 reload sb-web-helper --update-env
          else
            pm2 start npm --name "sb-web-helper" -- start
          fi
          pm2 save

      - name: Check PM2 Status
        run: |
          export NVM_DIR="$HOME/.nvm"
          [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
          pm2 status sb-web-helper

  # ============================================
  # 4. Verification
  # ============================================
  verify:
    name: ✅ Verify
    runs-on: [self-hosted, PRODUCTION-SB-WEB-HELPER]
    needs: deploy
    steps:
      - name: Check HTTP
        run: |
          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}\n" http://localhost:3000 || echo "FAILED")
          if [ "$HTTP_STATUS" == "200" ]; then echo "✅ OK"; else echo "⚠️ Status: $HTTP_STATUS"; fi

  # ============================================
  # 5. Deployment Summary
  # ============================================
  summary:
    name: 📝 Deployment Summary
    runs-on: ubuntu-latest
    needs: [pre_flight_checks, quality-gates, deploy, verify]
    if: always()
    steps:
      - name: Generate Summary Table
        run: |
          # กำหนด Emoji ตามสถานะของ Job
          get_status_emoji() {
            case "$1" in
              success) echo "✅ Success" ;;
              failure) echo "❌ Failed" ;;
              cancelled) echo "🚫 Cancelled" ;;
              skipped) echo "⏭️ Skipped" ;;
              *) echo "❓ Unknown" ;;
            esac
          }

          PRE_FLIGHT=$(get_status_emoji "${{ needs.pre_flight_checks.result }}")
          QUALITY=$(get_status_emoji "${{ needs.quality-gates.result }}")
          DEPLOY=$(get_status_emoji "${{ needs.deploy.result }}")
          VERIFY=$(get_status_emoji "${{ needs.verify.result }}")

          # เขียน Markdown ลงใน $GITHUB_STEP_SUMMARY
          echo "## 🚀 Production Deployment Report (Optimized Build)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job Name | Status | Details |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔍 Pre-flight Checks | $PRE_FLIGHT | Ref: \`${{ needs.pre_flight_checks.outputs.deployment_ref }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🛡️ Quality Gates | $QUALITY | Lint & Unit Tests |" >> $GITHUB_STEP_SUMMARY
          echo "| 🚀 Build & Deploy | $DEPLOY | Managed by: \`PM2\` (Server Build) |" >> $GITHUB_STEP_SUMMARY
          echo "| ✅ Health Check | $VERIFY | URL: [schoolbright.co](https://sb-helper.schoolbright.co) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** @${{ github.actor }} via \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Deployment Time:** $(date '+%Y-%m-%d %H:%M:%S') (UTC)" >> $GITHUB_STEP_SUMMARY
