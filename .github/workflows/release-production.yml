name: Production Deployment Pipeline

on:
  push:
    branches: [release/production]
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to deploy (leave empty to deploy latest commit)"
        required: false
        type: string
      skip_tests:
        description: "Skip test execution (not recommended)"
        required: false
        type: boolean
        default: false

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  NODE_VERSION: "20"
  BUN_VERSION: "latest"
  DEPLOY_PATH: "/var/www/sb-web-helper"
  ARTIFACT_NAME: "production-build"
  ARTIFACT_RETENTION_DAYS: 30

jobs:
  # ============================================
  # Pre-deployment Validation
  # ============================================
  pre_flight_checks:
    name: 🔍 Pre-flight Checks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment:
      name: production
    outputs:
      deployment_ref: ${{ steps.ref.outputs.ref }}
      deployment_sha: ${{ steps.ref.outputs.sha }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Determine Deployment Reference
        id: ref
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            REF="${{ inputs.tag }}"
            SHA=$(git rev-parse "refs/tags/${{ inputs.tag }}")
          else
            REF="${{ github.ref_name }}"
            SHA="${{ github.sha }}"
          fi
          echo "ref=${REF}" >> $GITHUB_OUTPUT
          echo "sha=${SHA}" >> $GITHUB_OUTPUT
          echo "📍 Deploying: ${REF} (${SHA:0:8})"

      - name: Validate SSH Configuration
        timeout-minutes: 2
        run: |
          if [ -z "${{ secrets.HUAWEI_CLOUD_HOST }}" ] || \
             [ -z "${{ secrets.HUAWEI_CLOUD_USERNAME }}" ] || \
             [ -z "${{ secrets.HUAWEI_CLOUD_PASSWORD }}" ]; then
            echo "❌ Missing required SSH secrets"
            exit 1
          fi
          echo "✅ SSH configuration validated"

      - name: Test Server Connectivity
        timeout-minutes: 2
        run: |
          sshpass -p "${{ secrets.HUAWEI_CLOUD_PASSWORD }}" \
            ssh -o StrictHostKeyChecking=no \
                -o ConnectTimeout=10 \
                -o ServerAliveInterval=5 \
                -o ServerAliveCountMax=2 \
                ${{ secrets.HUAWEI_CLOUD_USERNAME }}@${{ secrets.HUAWEI_CLOUD_HOST }} \
                "echo '✅ Server connection successful'" || {
            echo "❌ Failed to connect to production server"
            exit 1
          }

  # ============================================
  # Code Quality & Security
  # ============================================
  quality-gates:
    name: 🛡️ Quality & Security Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: pre_flight_checks
    if: ${{ !inputs.skip_tests }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.pre_flight_checks.outputs.deployment_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install Dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Lint Code
        run: |
          if [ -f "package.json" ] && npm run --silent | grep -q "lint"; then
            echo "📝 Running linter..."
            npm run lint
          else
            echo "⚠️ No lint script found, skipping..."
          fi

      - name: Run Tests
        run: |
          if [ -f "package.json" ] && npm run --silent | grep -q "test"; then
            echo "🧪 Running tests..."
            npm test
          else
            echo "⚠️ No test script found, skipping..."
          fi

      - name: Security Audit
        continue-on-error: true
        run: |
          echo "🔒 Running security audit..."
          npm audit --audit-level=high || echo "⚠️ Security vulnerabilities detected"

  # ============================================
  # Build Application
  # ============================================
  build:
    name: 🔨 Build Application
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [pre_flight_checks]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.pre_flight_checks.outputs.deployment_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Verify Bun Installation
        run: bun --version

      - name: Install Dependencies
        run: |
          echo "📦 Installing dependencies..."
          npm ci --prefer-offline --no-audit
          echo "✅ Dependencies installed"

      - name: Generate Prisma Client
        run: |
          echo "⚙️ Generating Prisma clients..."
          if [ -f "prisma/schema.prisma" ]; then
            bun x prisma generate --schema=prisma/schema.prisma
          fi
          if [ -f "prisma/timesheet/schema.prisma" ]; then
            bun x prisma generate --schema=prisma/timesheet/schema.prisma
          fi
          echo "✅ Prisma clients generated"

      - name: Build Application
        run: |
          echo "🏗️ Building application..."
          bun run build
          echo "✅ Build completed"

      - name: Verify Build Output
        run: |
          if [ ! -d ".next" ]; then
            echo "❌ Build output (.next) not found!"
            exit 1
          fi
          echo "✅ Build output verified"

      - name: Create Deployment Archive
        run: |
          echo "📦 Creating deployment package..."
          zip -r -q ${{ env.ARTIFACT_NAME }}.zip \
            .next \
            public \
            $([ -d "generated/prisma" ] && echo "generated/prisma") \
            $([ -d "generated/prisma-timesheet" ] && echo "generated/prisma-timesheet") \
            package.json \
            package-lock.json \
            next.config.mjs

          SIZE=$(du -h "${{ env.ARTIFACT_NAME }}.zip" | cut -f1)
          echo "✅ Archive created (${SIZE})"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_NAME }}.zip
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}
          compression-level: 0

  # ============================================
  # Deploy to Production
  # ============================================
  deploy:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [pre_flight_checks, build]
    environment:
      name: production
      url: https://sb-helper.schoolbright.co

    steps:
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}

      - name: Prepare Deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HUAWEI_CLOUD_HOST }}
          username: ${{ secrets.HUAWEI_CLOUD_USERNAME }}
          password: ${{ secrets.HUAWEI_CLOUD_PASSWORD }}
          port: ${{ secrets.HUAWEI_CLOUD_SSH_PORT }}
          command_timeout: 10m
          script: |
            set -e
            echo "🔧 Preparing deployment directory..."

            # Create backup of current deployment
            if [ -d "${{ env.DEPLOY_PATH }}" ]; then
              BACKUP_DIR="${{ env.DEPLOY_PATH }}.backup.$(date +%Y%m%d_%H%M%S)"
              echo "💾 Creating backup: ${BACKUP_DIR}"
              cp -r "${{ env.DEPLOY_PATH }}" "${BACKUP_DIR}"
              
              # Keep only last 3 backups
              ls -dt ${{ env.DEPLOY_PATH }}.backup.* 2>/dev/null | tail -n +4 | xargs rm -rf 2>/dev/null || true
            fi

            # Prepare deployment directory
            mkdir -p "${{ env.DEPLOY_PATH }}"
            cd "${{ env.DEPLOY_PATH }}"

            # Backup environment file
            if [ -f ".env" ]; then
              cp .env .env.backup
              echo "✅ Environment file backed up"
            fi

            # Clean old files (except .env)
            find . -mindepth 1 ! -name '.env*' -delete
            echo "✅ Deployment directory prepared"

      - name: Transfer Build to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HUAWEI_CLOUD_HOST }}
          username: ${{ secrets.HUAWEI_CLOUD_USERNAME }}
          password: ${{ secrets.HUAWEI_CLOUD_PASSWORD }}
          port: ${{ secrets.HUAWEI_CLOUD_SSH_PORT }}
          source: "${{ env.ARTIFACT_NAME }}.zip"
          target: ${{ env.DEPLOY_PATH }}
          timeout: 10m

      - name: Deploy Application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HUAWEI_CLOUD_HOST }}
          username: ${{ secrets.HUAWEI_CLOUD_USERNAME }}
          password: ${{ secrets.HUAWEI_CLOUD_PASSWORD }}
          port: ${{ secrets.HUAWEI_CLOUD_SSH_PORT }}
          command_timeout: 15m
          script: |
            set -e
            cd "${{ env.DEPLOY_PATH }}"

            echo "📦 Extracting deployment package..."
            unzip -oq "${{ env.ARTIFACT_NAME }}.zip"
            rm "${{ env.ARTIFACT_NAME }}.zip"

            # Restore environment file
            if [ -f ".env.backup" ]; then
              mv .env.backup .env
              echo "✅ Environment file restored"
            fi

            echo "📦 Installing production dependencies..."
            npm ci --production --prefer-offline --no-audit

            # Verify critical dependencies
            if [ ! -d "node_modules" ] || [ ! -f "node_modules/next/dist/bin/next" ]; then
              echo "❌ Critical dependencies missing!"
              exit 1
            fi

            echo "✅ Dependencies installed successfully"

            # Set proper permissions
            chown -R www-data:www-data "${{ env.DEPLOY_PATH }}" || true

            echo "🔄 Restarting application service..."
            sudo systemctl restart sb-web-helper.service

            # Wait for service to initialize
            sleep 5

            # Health check with retries
            MAX_RETRIES=6
            RETRY_COUNT=0

            while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              if sudo systemctl is-active --quiet sb-web-helper.service; then
                echo "✅ Service is running and healthy"
                break
              fi
              
              RETRY_COUNT=$((RETRY_COUNT + 1))
              if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
                echo "❌ Service failed health check after ${MAX_RETRIES} attempts"
                echo "📋 Recent logs:"
                sudo journalctl -u sb-web-helper.service -n 30 --no-pager
                exit 1
              fi
              
              echo "⏳ Waiting for service to start (attempt ${RETRY_COUNT}/${MAX_RETRIES})..."
              sleep 5
            done

            echo "✅ Deployment completed successfully!"

  # ============================================
  # Post-deployment Verification
  # ============================================
  verify:
    name: ✅ Post-deployment Verification
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [deploy, pre_flight_checks]
    environment:
      name: production

    steps:
      - name: Verify Service Status
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HUAWEI_CLOUD_HOST }}
          username: ${{ secrets.HUAWEI_CLOUD_USERNAME }}
          password: ${{ secrets.HUAWEI_CLOUD_PASSWORD }}
          port: ${{ secrets.HUAWEI_CLOUD_SSH_PORT }}
          script: |
            set -e

            echo "🔍 Verifying deployment..."

            # Check service status
            if ! sudo systemctl is-active --quiet sb-web-helper.service; then
              echo "❌ Service is not running!"
              exit 1
            fi

            # Check if application is responding
            if ! curl -sf http://localhost:3000 > /dev/null 2>&1; then
              echo "⚠️ Application may not be responding on localhost"
            fi

            # Display service info
            echo "📊 Service Status:"
            sudo systemctl status sb-web-helper.service --no-pager -l | head -n 15

            echo "✅ Verification completed"

      - name: Deployment Summary
        run: |
          echo "============================================"
          echo "🎉 DEPLOYMENT SUCCESSFUL"
          echo "============================================"
          echo "📍 Reference: ${{ needs.pre_flight_checks.outputs.deployment_ref }}"
          echo "🔖 Commit: ${{ needs.pre_flight_checks.outputs.deployment_sha }}"
          echo "🕐 Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "============================================"

  # ============================================
  # Rollback on Failure
  # ============================================
  rollback:
    name: 🔄 Rollback Deployment
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [deploy, verify]
    environment:
      name: production
    if: failure()

    steps:
      - name: Restore Previous Version
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HUAWEI_CLOUD_HOST }}
          username: ${{ secrets.HUAWEI_CLOUD_USERNAME }}
          password: ${{ secrets.HUAWEI_CLOUD_PASSWORD }}
          port: ${{ secrets.HUAWEI_CLOUD_SSH_PORT }}
          script: |
            set -e
            echo "🔄 Initiating rollback..."

            # Find most recent backup
            LATEST_BACKUP=$(ls -dt ${{ env.DEPLOY_PATH }}.backup.* 2>/dev/null | head -n1)

            if [ -z "$LATEST_BACKUP" ]; then
              echo "❌ No backup found for rollback!"
              exit 1
            fi

            echo "📦 Restoring from: ${LATEST_BACKUP}"

            # Backup failed deployment for investigation
            if [ -d "${{ env.DEPLOY_PATH }}" ]; then
              mv "${{ env.DEPLOY_PATH }}" "${{ env.DEPLOY_PATH }}.failed.$(date +%Y%m%d_%H%M%S)"
            fi

            # Restore backup
            mv "${LATEST_BACKUP}" "${{ env.DEPLOY_PATH }}"

            # Restart service
            sudo systemctl restart sb-web-helper.service
            sleep 5

            if sudo systemctl is-active --quiet sb-web-helper.service; then
              echo "✅ Rollback completed successfully"
            else
              echo "❌ Rollback failed - manual intervention required!"
              exit 1
            fi

      - name: Notify Rollback
        run: |
          echo "============================================"
          echo "⚠️ DEPLOYMENT ROLLED BACK"
          echo "============================================"
          echo "Previous version has been restored"
          echo "Please investigate the deployment failure"
          echo "============================================"
