name: Release Production (BUN)

on:
  push:
    branches: [release/production]
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to deploy (optional). If empty, uses the selected ref in the UI or the commit that triggered the run"
        required: false

jobs:
  remove-old-artifact:
    name: 🗑️ Remove Old Artifacts
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: ⏱️ Start Timer
        id: timer
        run: echo "start_time=$(date +%s)" >> $GITHUB_OUTPUT

      - name: 🧪 Test SSH Connection
        run: |
          echo "👉 Testing SSH connection to production server..."
          sshpass -p "${{ secrets.HUAWEI_CLOUD_PASSWORD }}" ssh -o StrictHostKeyChecking=no ${{ secrets.HUAWEI_CLOUD_USERNAME }}@${{ secrets.HUAWEI_CLOUD_HOST }} "echo '✅ SSH Success'" || echo "❌ SSH Failed"

      - name: ⏱️ Job Duration
        run: |
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - ${{ steps.timer.outputs.start_time }}))
          echo "⏱️ SSH Test completed in: ${DURATION}s"

  build:
    name: "🔨 Build on Runner"
    needs: remove-old-artifact
    runs-on: ubuntu-latest

    steps:
      - name: ⏱️ Start Timer
        id: timer
        run: echo "start_time=$(date +%s)" >> $GITHUB_OUTPUT

      - name: "📥 Checkout Code"
        id: checkout
        run: |
          STEP_START=$(date +%s)
          echo "step_start=${STEP_START}" >> $GITHUB_OUTPUT

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: ⏱️ Checkout Duration
        run: |
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - ${{ steps.checkout.outputs.step_start }}))
          echo "⏱️ Checkout completed in: ${DURATION}s"

      - name: "⚙️ Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: "⚙️ Setup Bun"
        id: setup_bun
        run: |
          echo "👉 Setting up Bun..."
          STEP_START=$(date +%s)
          echo "step_start=${STEP_START}" >> $GITHUB_OUTPUT
          curl -fsSL https://bun.sh/install | bash
          echo "$HOME/.bun/bin" >> $GITHUB_PATH

      - name: ⏱️ Bun Setup Duration
        run: |
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - ${{ steps.setup_bun.outputs.step_start }}))
          echo "⏱️ Bun setup completed in: ${DURATION}s"

      - name: "🔍 Verify Bun Installation"
        run: |
          export PATH="$HOME/.bun/bin:$PATH"
          bun --version

      - name: "📦 Install Dependencies (NPM)"
        id: install
        run: |
          echo "👉 Installing dependencies with npm ci..."
          echo "⚠️ Using npm because bun install has git clone issues"
          STEP_START=$(date +%s)
          echo "step_start=${STEP_START}" >> $GITHUB_OUTPUT
          npm ci

      - name: ⏱️ Install Duration
        run: |
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - ${{ steps.install.outputs.step_start }}))
          echo "⏱️ Dependencies installed with npm in: ${DURATION}s"

      - name: "❇️ Push Prisma into Database"
        id: prisma_push
        run: |
          echo "👉 Pushing Prisma into database..."
          STEP_START=$(date +%s)
          echo "step_start=${STEP_START}" >> $GITHUB_OUTPUT
          # npx prisma db push --schema=prisma/timesheet/schema.prisma

      - name: ⏱️ Prisma Push Duration
        run: |
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - ${{ steps.prisma_push.outputs.step_start }}))
          echo "⏱️ Prisma push completed in: ${DURATION}s"

      - name: "⚙️ Prisma Generate"
        id: prisma_gen
        run: |
          echo "👉 Generating Prisma client with Bun..."
          STEP_START=$(date +%s)
          echo "step_start=${STEP_START}" >> $GITHUB_OUTPUT
          export PATH="$HOME/.bun/bin:$PATH"
          bun x prisma generate --schema=prisma/schema.prisma
          bun x prisma generate --schema=prisma/timesheet/schema.prisma

      - name: ⏱️ Prisma Generate Duration
        run: |
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - ${{ steps.prisma_gen.outputs.step_start }}))
          echo "⏱️ Prisma generate completed in: ${DURATION}s"

      - name: "🏗️ Build Project"
        id: build
        run: |
          echo "👉 Building project with Bun..."
          STEP_START=$(date +%s)
          echo "step_start=${STEP_START}" >> $GITHUB_OUTPUT
          export PATH="$HOME/.bun/bin:$PATH"
          bun run build

      - name: ⏱️ Build Duration
        run: |
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - ${{ steps.build.outputs.step_start }}))
          echo "⏱️ Build completed in: ${DURATION}s"

      - name: "📤 Archive Build Artifacts"
        id: archive
        run: |
          echo "👉 Archiving build artifacts..."
          STEP_START=$(date +%s)
          echo "step_start=${STEP_START}" >> $GITHUB_OUTPUT
          zip -r build.zip \
            .next \
            public \
            generated/prisma \
            generated/prisma-timesheet \
            package.json \
            package-lock.json \
            next.config.mjs

      - name: ⏱️ Archive Duration
        run: |
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - ${{ steps.archive.outputs.step_start }}))
          echo "⏱️ Archive completed in: ${DURATION}s"

      - name: "⬆️ Upload Artifacts"
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: build.zip

      - name: "✅ Total Build Job Duration"
        run: |
          END_TIME=$(date +%s)
          TOTAL_DURATION=$((END_TIME - ${{ steps.timer.outputs.start_time }}))
          echo "========================================"
          echo "⏱️ TOTAL BUILD JOB: ${TOTAL_DURATION}s"
          echo "========================================"

  deploy:
    name: "🚚 Deploy to Server"
    runs-on: ubuntu-latest
    needs: build
    environment: production

    steps:
      - name: ⏱️ Start Timer
        id: timer
        run: echo "start_time=$(date +%s)" >> $GITHUB_OUTPUT

      - name: "🗑️ Delete old deployment folder"
        id: cleanup
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.HUAWEI_CLOUD_HOST }}
          username: ${{ secrets.HUAWEI_CLOUD_USERNAME }}
          password: ${{ secrets.HUAWEI_CLOUD_PASSWORD }}
          port: ${{ secrets.HUAWEI_CLOUD_SSH_PORT }}
          script: |
            echo "👉 Removing old deployment files..."
            STEP_START=$(date +%s)
            rm -rf /var/www/sb-web-helper/*
            STEP_END=$(date +%s)
            echo "⏱️ Cleanup took: $((STEP_END - STEP_START))s"

      - name: "📥 Download Artifacts"
        id: download
        run: |
          STEP_START=$(date +%s)
          echo "step_start=${STEP_START}" >> $GITHUB_OUTPUT

      - uses: actions/download-artifact@v4
        with:
          name: build-output

      - name: ⏱️ Download Duration
        run: |
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - ${{ steps.download.outputs.step_start }}))
          echo "⏱️ Download completed in: ${DURATION}s"

      - name: "🔐 Copy to Server via SCP"
        id: scp
        run: |
          STEP_START=$(date +%s)
          echo "step_start=${STEP_START}" >> $GITHUB_OUTPUT

      - uses: appleboy/scp-action@v0.1.5
        with:
          host: ${{ secrets.HUAWEI_CLOUD_HOST }}
          username: ${{ secrets.HUAWEI_CLOUD_USERNAME }}
          password: ${{ secrets.HUAWEI_CLOUD_PASSWORD }}
          port: ${{ secrets.HUAWEI_CLOUD_SSH_PORT }}
          source: "build.zip"
          target: "/var/www/sb-web-helper"

      - name: ⏱️ SCP Duration
        run: |
          END_TIME=$(date +%s)
          DURATION=$((END_TIME - ${{ steps.scp.outputs.step_start }}))
          echo "⏱️ SCP completed in: ${DURATION}s"

      - name: "🗜️ Unzip & Install on Server"
        uses: appleboy/ssh-action@v0.1.8
        with:
          host: ${{ secrets.HUAWEI_CLOUD_HOST }}
          username: ${{ secrets.HUAWEI_CLOUD_USERNAME }}
          password: ${{ secrets.HUAWEI_CLOUD_PASSWORD }}
          port: ${{ secrets.HUAWEI_CLOUD_SSH_PORT }}
          script: |
            set -e  # Exit on error
            echo "👉 Extracting and installing..."
            DEPLOY_START=$(date +%s)
            
            cd /var/www/sb-web-helper
            
            # Backup .env file
            if [ -f .env ]; then
              cp .env .env.backup
              echo "✅ Backed up .env"
            fi
            
            # Unzip
            UNZIP_START=$(date +%s)
            unzip -o build.zip
            UNZIP_END=$(date +%s)
            echo "⏱️ Unzip took: $((UNZIP_END - UNZIP_START))s"
            
            # Restore .env
            if [ -f .env.backup ]; then
              mv .env.backup .env
              echo "✅ Restored .env"
            fi
            
            # Install dependencies with npm
            INSTALL_START=$(date +%s)
            echo "👉 Installing dependencies..."
            
            # Use npm ci for production (faster and more reliable)
            if [ -f package-lock.json ]; then
              npm ci --production --legacy-peer-deps
            else
              npm install --production --legacy-peer-deps
            fi
            
            INSTALL_END=$(date +%s)
            echo "⏱️ npm install took: $((INSTALL_END - INSTALL_START))s"
            
            # Verify node_modules exists
            if [ ! -d "node_modules" ] || [ ! -f "node_modules/next/dist/bin/next" ]; then
              echo "❌ ERROR: node_modules/next not found!"
              exit 1
            fi
            echo "✅ Dependencies installed successfully"
            
            # Restart service
            RESTART_START=$(date +%s)
            echo "👉 Restarting service..."
            sudo systemctl restart sb-web-helper.service
            RESTART_END=$(date +%s)
            echo "⏱️ Service restart took: $((RESTART_END - RESTART_START))s"
            
            # Wait for service to start
            sleep 3
            
            # Check service status
            if sudo systemctl is-active --quiet sb-web-helper.service; then
              echo "✅ Service is running"
            else  
              echo "❌ Service failed to start!"
              sudo journalctl -u sb-web-helper.service -n 20 --no-pager
              exit 1
            fi
            
            DEPLOY_END=$(date +%s)
            echo "========================================"
            echo "⏱️ TOTAL DEPLOY TIME: $((DEPLOY_END - DEPLOY_START))s"
            echo "========================================"
            echo "✅ Deployment completed successfully!"

      - name: "✅ Total Deploy Job Duration"
        run: |
          END_TIME=$(date +%s)
          TOTAL_DURATION=$((END_TIME - ${{ steps.timer.outputs.start_time }}))
          echo "========================================"
          echo "⏱️ TOTAL DEPLOY JOB: ${TOTAL_DURATION}s"
          echo "========================================"
