name: Production Deployment Pipeline

on:
  push:
    branches: [release/production]
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to deploy (leave empty to deploy latest commit)"
        required: false
        type: string
      skip_tests:
        description: "Skip test execution (not recommended)"
        required: false
        type: boolean
        default: false

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  DEPLOY_PATH: "/var/www/sb-web-helper"
  ARTIFACT_NAME: "production-build"

jobs:
  # ============================================
  # 1. Pre-flight Checks
  # ============================================
  pre_flight_checks:
    name: 🔍 Pre-flight Checks
    runs-on: [self-hosted, PRODUCTION-SB-WEB-HELPER]
    timeout-minutes: 5
    environment: production
    outputs:
      deployment_ref: ${{ steps.ref.outputs.ref }}
      deployment_sha: ${{ steps.ref.outputs.sha }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Determine Deployment Reference
        id: ref
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            REF="${{ inputs.tag }}"
            SHA=$(git rev-parse "refs/tags/${{ inputs.tag }}")
          else
            REF="${{ github.ref_name }}"
            SHA="${{ github.sha }}"
          fi
          echo "ref=${REF}" >> $GITHUB_OUTPUT
          echo "sha=${SHA}" >> $GITHUB_OUTPUT

      - name: Validate Directorys
        run: mkdir -p "${{ env.DEPLOY_PATH }}"

  # ============================================
  # 2. Quality & Security
  # ============================================
  quality-gates:
    name: 🛡️ Quality & Security
    runs-on: ubuntu-latest
    needs: pre_flight_checks
    if: ${{ !inputs.skip_tests }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.pre_flight_checks.outputs.deployment_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"
      - run: npm ci --prefer-offline --no-audit
      - run: if npm run --silent | grep -q "lint"; then npm run lint; fi
      - run: if npm run --silent | grep -q "test"; then npm test; fi
      - run: npm audit --audit-level=high || echo "⚠️ Audit warning"

  # ============================================
  # 3. Build on GitHub Cloud
  # ============================================
  build:
    name: 🔨 Build on GitHub
    runs-on: ubuntu-latest
    needs: [pre_flight_checks, quality-gates]
    if: |
      always() &&
      (needs.quality-gates.result == 'success' || needs.quality-gates.result == 'skipped') &&
      needs.pre_flight_checks.result == 'success'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.pre_flight_checks.outputs.deployment_sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install Dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Generate Prisma Client (Build Time)
        run: |
          if [ -f "prisma/schema.prisma" ]; then npx prisma generate --schema=prisma/schema.prisma; fi
          if [ -f "prisma/timesheet/schema.prisma" ]; then npx prisma generate --schema=prisma/timesheet/schema.prisma; fi

      - name: Build Application
        run: npm run build

      # ✅ Pack ไฟล์เป็นก้อนเดียว (Tarball)
      - name: 📦 Pack Artifacts
        run: |
          tar -czf artifact.tar.gz .next public package.json package-lock.json next.config.mjs prisma

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          retention-days: 1
          path: artifact.tar.gz

  # ============================================
  # 4. Deploy to Production (Self-hosted)
  # ============================================
  deploy:
    name: 🚀 Deploy to Production
    runs-on: [self-hosted, PRODUCTION-SB-WEB-HELPER]
    needs: [pre_flight_checks, build]
    environment:
      name: production
      url: https://sb-helper.schoolbright.co

    steps:
      - name: Prepare Deployment Directory
        run: |
          echo "🔧 Cleaning: ${{ env.DEPLOY_PATH }}"
          sudo mkdir -p "${{ env.DEPLOY_PATH }}"

          # เปลี่ยนเจ้าของชั่วคราวให้ Runner เขียนไฟล์ได้
          echo "🔐 Granting write access to runner..."
          sudo chown -R $USER:$USER "${{ env.DEPLOY_PATH }}"

          # ล้างไฟล์เก่าทิ้ง
          cd "${{ env.DEPLOY_PATH }}"
          rm -rf *

      # ✅ แยก Step ออกมาถูกต้องแล้ว
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.DEPLOY_PATH }}

      # ✅ แตกไฟล์ Tarball
      - name: 📦 Extract Artifacts
        run: |
          cd "${{ env.DEPLOY_PATH }}"
          echo "📂 Extracting artifact..."
          tar -xzf artifact.tar.gz
          rm artifact.tar.gz

          # ตรวจสอบทันทีว่า .next มาจริงไหม
          if [ -d ".next" ]; then
             echo "✅ .next folder found!"
          else
             echo "❌ Error: .next folder is missing!"
             exit 1
          fi

      - name: Install Deps & Regenerate Prisma
        run: |
          cd "${{ env.DEPLOY_PATH }}"

          echo "📦 Installing Prod Dependencies..."
          # ✅ ใช้ --legacy-peer-deps แก้ปัญหา ESLint Conflict
          npm ci --omit=dev --legacy-peer-deps --prefer-offline --no-audit

          echo "🔧 Installing Prisma CLI..."
          # ✅ ลง Prisma แยกเพื่อให้ npx หา version เจอ
          npm install --no-save --legacy-peer-deps prisma

          echo "⚙️ Regenerating Prisma (Server OS)..."
          if [ -f "prisma/schema.prisma" ]; then npx prisma generate --schema=prisma/schema.prisma; fi
          if [ -f "prisma/timesheet/schema.prisma" ]; then npx prisma generate --schema=prisma/timesheet/schema.prisma; fi

          echo "🔐 Setting Permissions for Service..."
          # ✅ ตั้ง Owner เป็น root ให้ตรงกับ Service File ของคุณ
          sudo chown -R root:root "${{ env.DEPLOY_PATH }}"
          sudo chmod -R 755 "${{ env.DEPLOY_PATH }}"

      - name: Restart Service
        run: |
          sudo systemctl restart sb-web-helper.service
          sleep 5
          if sudo systemctl is-active --quiet sb-web-helper.service; then
            echo "✅ Service Active"
          else
            echo "❌ Service Failed"
            sudo journalctl -u sb-web-helper.service -n 20 --no-pager
            exit 1
          fi

  # ============================================
  # 5. Verification
  # ============================================
  verify:
    name: ✅ Verify
    runs-on: [self-hosted, PRODUCTION-SB-WEB-HELPER]
    needs: deploy
    steps:
      - name: Check HTTP
        run: |
          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}\n" http://localhost:3000 || echo "FAILED")
          if [ "$HTTP_STATUS" == "200" ]; then echo "✅ OK"; else echo "⚠️ Status: $HTTP_STATUS"; fi

  # ============================================
  # 6. Deployment Summary
  # ============================================
  summary:
    name: 📝 Deployment Summary
    runs-on: ubuntu-latest
    needs: [pre_flight_checks, quality-gates, build, deploy, verify]
    if: always()
    steps:
      - name: Generate Summary Table
        run: |
          # กำหนด Emoji ตามสถานะของ Job
          get_status_emoji() {
            case "$1" in
              success) echo "✅ Success" ;;
              failure) echo "❌ Failed" ;;
              cancelled) echo "🚫 Cancelled" ;;
              skipped) echo "⏭️ Skipped" ;;
              *) echo "❓ Unknown" ;;
            esac
          }

          PRE_FLIGHT=$(get_status_emoji "${{ needs.pre_flight_checks.result }}")
          QUALITY=$(get_status_emoji "${{ needs.quality-gates.result }}")
          BUILD=$(get_status_emoji "${{ needs.build.result }}")
          DEPLOY=$(get_status_emoji "${{ needs.deploy.result }}")
          VERIFY=$(get_status_emoji "${{ needs.verify.result }}")

          # เขียน Markdown ลงใน $GITHUB_STEP_SUMMARY
          echo "## 🚀 Production Deployment Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job Name | Status | Details |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔍 Pre-flight Checks | $PRE_FLIGHT | Ref: \`${{ needs.pre_flight_checks.outputs.deployment_ref }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| 🛡️ Quality Gates | $QUALITY | Lint & Unit Tests |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔨 Build Artifact | $BUILD | Node v${{ env.NODE_VERSION }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🚀 Production Deploy | $DEPLOY | Path: \`${{ env.DEPLOY_PATH }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| ✅ Health Check | $VERIFY | URL: [schoolbright.co](https://sb-helper.schoolbright.co) |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "**Triggered by:** @${{ github.actor }} via \`${{ github.event_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Deployment Time:** $(date '+%Y-%m-%d %H:%M:%S') (UTC)" >> $GITHUB_STEP_SUMMARY
