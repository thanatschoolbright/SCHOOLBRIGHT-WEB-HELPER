name: Production Deployment Pipeline

on:
  push:
    branches: [release/production]
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to deploy (leave empty to deploy latest commit)"
        required: false
        type: string
      skip_tests:
        description: "Skip test execution (not recommended)"
        required: false
        type: boolean
        default: false

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  NODE_VERSION: "20"
  BUN_VERSION: "latest"
  DEPLOY_PATH: "/var/www/sb-web-helper"
  ARTIFACT_NAME: "production-build"
  ARTIFACT_RETENTION_DAYS: 30

jobs:
  # ============================================
  # Pre-deployment Validation
  # ============================================
  pre_flight_checks:
    name: 🔍 Pre-flight Checks
    runs-on: [self-hosted, PRODUCTION-SB-WEB-HELPER]
    timeout-minutes: 5
    environment:
      name: production
    outputs:
      deployment_ref: ${{ steps.ref.outputs.ref }}
      deployment_sha: ${{ steps.ref.outputs.sha }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Determine Deployment Reference
        id: ref
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            REF="${{ inputs.tag }}"
            SHA=$(git rev-parse "refs/tags/${{ inputs.tag }}")
          else
            REF="${{ github.ref_name }}"
            SHA="${{ github.sha }}"
          fi
          echo "ref=${REF}" >> $GITHUB_OUTPUT
          echo "sha=${SHA}" >> $GITHUB_OUTPUT
          echo "📍 Deploying: ${REF} (${SHA:0:8})"

      - name: Validate Deployment Directory
        timeout-minutes: 2
        run: |
          if [ ! -d "${{ env.DEPLOY_PATH }}" ]; then
            echo "⚠️ Deployment directory does not exist, creating..."
            mkdir -p "${{ env.DEPLOY_PATH }}"
          fi
          echo "✅ Deployment directory validated"

  # ============================================
  # Code Quality & Security
  # ============================================
  quality-gates:
    name: 🛡️ Quality & Security Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: pre_flight_checks
    if: ${{ !inputs.skip_tests }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.pre_flight_checks.outputs.deployment_sha }}

      - name: Install Dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Lint Code
        run: |
          if [ -f "package.json" ] && npm run --silent | grep -q "lint"; then
            echo "📝 Running linter..."
            npm run lint
          else
            echo "⚠️ No lint script found, skipping..."
          fi

      - name: Run Tests
        run: |
          if [ -f "package.json" ] && npm run --silent | grep -q "test"; then
            echo "🧪 Running tests..."
            npm test
          else
            echo "⚠️ No test script found, skipping..."
          fi

      - name: Security Audit
        continue-on-error: true
        run: |
          echo "🔒 Running security audit..."
          npm audit --audit-level=high || echo "⚠️ Security vulnerabilities detected"

  # ============================================
  # Build Application
  # ============================================
  build:
    name: 🔨 Build Application
    runs-on: [self-hosted, PRODUCTION-SB-WEB-HELPER]
    timeout-minutes: 120
    needs: [pre_flight_checks]

    steps:
      - name: Fix Workspace Permissions
        run: |
          sudo chown -R githubrunner:githubrunner "${GITHUB_WORKSPACE%/*}" || true
          sudo chmod -R u+rwX "${GITHUB_WORKSPACE%/*}" || true

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.pre_flight_checks.outputs.deployment_sha }}

      - name: Verify Bun Installation
        run: bun --version

      - name: Install Dependencies
        run: |
          echo "📦 Installing dependencies..."
          npm ci --prefer-offline --no-audit
          echo "✅ Dependencies installed"

      - name: Generate Prisma Client
        run: |
          echo "⚙️ Generating Prisma clients..."
          if [ -f "prisma/schema.prisma" ]; then
            bun x prisma generate --schema=prisma/schema.prisma
          fi
          if [ -f "prisma/timesheet/schema.prisma" ]; then
            bun x prisma generate --schema=prisma/timesheet/schema.prisma
          fi
          echo "✅ Prisma clients generated"

      - name: Build Application (NPM)
        run: |
          echo "🏗️ Building application..."
          npm run build
          echo "✅ Build completed"

      - name: Verify Build Output
        run: |
          if [ ! -d ".next" ]; then
            echo "❌ Build output (.next) not found!"
            exit 1
          fi
          echo "✅ Build output verified"

  # ============================================
  # Deploy to Production
  # ============================================
  deploy:
    name: 🚀 Deploy to Production
    runs-on: [self-hosted, PRODUCTION-SB-WEB-HELPER]
    timeout-minutes: 20
    needs: [pre_flight_checks, build]
    environment:
      name: production
      url: https://sb-helper.schoolbright.co

    steps:
      - name: Prepare Deployment
        run: |
          set -e
          echo "🔧 Preparing deployment directory..."

          # Create backup of current deployment
          if [ -d "${{ env.DEPLOY_PATH }}" ]; then
            BACKUP_DIR="${{ env.DEPLOY_PATH }}.backup.$(date +%Y%m%d_%H%M%S)"
            echo "💾 Creating backup: ${BACKUP_DIR}"
            sudo cp -r "${{ env.DEPLOY_PATH }}" "${BACKUP_DIR}"
            
            # Keep only last 3 backups
            ls -dt ${{ env.DEPLOY_PATH }}.backup.* 2>/dev/null | tail -n +4 | xargs sudo rm -rf 2>/dev/null || true
          fi

          # Prepare deployment directory
          sudo mkdir -p "${{ env.DEPLOY_PATH }}"
          cd "${{ env.DEPLOY_PATH }}"

          # Backup environment file
          if [ -f ".env" ]; then
            sudo cp .env .env.backup
            echo "✅ Environment file backed up"
          fi

          # Clean old files (except .env)
          sudo find . -mindepth 1 ! -name '.env*' -delete
          echo "✅ Deployment directory prepared"

      - name: Copy Build Files
        run: |
          set -e
          echo "📦 Copying build files to deployment directory..."

          # Copy built files from GitHub Actions workspace to deployment directory
          sudo cp -r ${{ github.workspace }}/.next "${{ env.DEPLOY_PATH }}/"
          sudo cp -r ${{ github.workspace }}/public "${{ env.DEPLOY_PATH }}/"

          # Copy Prisma generated files if they exist
          if [ -d "${{ github.workspace }}/generated/prisma" ]; then
            sudo mkdir -p "${{ env.DEPLOY_PATH }}/generated"
            sudo cp -r ${{ github.workspace }}/generated/prisma "${{ env.DEPLOY_PATH }}/generated/"
          fi

          if [ -d "${{ github.workspace }}/generated/prisma-timesheet" ]; then
            sudo mkdir -p "${{ env.DEPLOY_PATH }}/generated"
            sudo cp -r ${{ github.workspace }}/generated/prisma-timesheet "${{ env.DEPLOY_PATH }}/generated/"
          fi

          # Copy configuration files
          sudo cp ${{ github.workspace }}/package.json "${{ env.DEPLOY_PATH }}/"
          sudo cp ${{ github.workspace }}/package-lock.json "${{ env.DEPLOY_PATH }}/"
          sudo cp ${{ github.workspace }}/next.config.mjs "${{ env.DEPLOY_PATH }}/"

          echo "✅ Build files copied successfully"

      - name: Deploy Application
        run: |
          set -e
          cd "${{ env.DEPLOY_PATH }}"

          # Restore environment file
          if [ -f ".env.backup" ]; then
            sudo mv .env.backup .env
            echo "✅ Environment file restored"
          fi

          echo "📦 Installing production dependencies (omitting devDependencies)..."
          # Use --omit=dev (preferred) instead of the deprecated --production flag.
          # If peer dependency resolution fails in some npm versions, retry with --legacy-peer-deps
          sudo npm ci --omit=dev --prefer-offline --no-audit || \
          sudo npm ci --omit=dev --legacy-peer-deps --prefer-offline --no-audit

          # Verify critical dependencies
          if [ ! -d "node_modules" ] || [ ! -f "node_modules/next/dist/bin/next" ]; then
            echo "❌ Critical dependencies missing!"
            exit 1
          fi

          echo "✅ Dependencies installed successfully"

          # Set proper permissions
          sudo chown -R www-data:www-data "${{ env.DEPLOY_PATH }}" || true

          echo "🔄 Restarting application service..."
          sudo systemctl restart sb-web-helper.service

          # Wait for service to initialize
          sleep 5

          # Health check with retries
          MAX_RETRIES=6
          RETRY_COUNT=0

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if sudo systemctl is-active --quiet sb-web-helper.service; then
              echo "✅ Service is running and healthy"
              break
            fi
            
            RETRY_COUNT=$((RETRY_COUNT + 1))
            if [ $RETRY_COUNT -eq $MAX_RETRIES ]; then
              echo "❌ Service failed health check after ${MAX_RETRIES} attempts"
              echo "📋 Recent logs:"
              sudo journalctl -u sb-web-helper.service -n 30 --no-pager
              exit 1
            fi
            
            echo "⏳ Waiting for service to start (attempt ${RETRY_COUNT}/${MAX_RETRIES})..."
            sleep 5
          done

          echo "✅ Deployment completed successfully!"

  # ============================================
  # Post-deployment Verification_
  # ============================================
  verify:
    name: ✅ Post-deployment Verification
    runs-on: [self-hosted, PRODUCTION-SB-WEB-HELPER]
    timeout-minutes: 5
    needs: [deploy, pre_flight_checks]
    environment:
      name: production

    steps:
      - name: Verify Service Status
        run: |
          set -e

          echo "🔍 Verifying deployment..."

          # Check service status
          if ! sudo systemctl is-active --quiet sb-web-helper.service; then
            echo "❌ Service is not running!"
            exit 1
          fi

          # Check if application is responding
          if ! curl -sf http://localhost:3000 > /dev/null 2>&1; then
            echo "⚠️ Application may not be responding on localhost"
          fi

          # Display service info
          echo "📊 Service Status:"
          sudo systemctl status sb-web-helper.service --no-pager -l | head -n 15

          echo "✅ Verification completed"

      - name: Deployment Summary
        run: |
          echo "============================================"
          echo "🎉 DEPLOYMENT SUCCESSFUL"
          echo "============================================"
          echo "📍 Reference: ${{ needs.pre_flight_checks.outputs.deployment_ref }}"
          echo "🔖 Commit: ${{ needs.pre_flight_checks.outputs.deployment_sha }}"
          echo "🕐 Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "============================================"

  # ============================================
  # Rollback on Failure
  # ============================================
  rollback:
    name: 🔄 Rollback Deployment
    runs-on: [self-hosted, PRODUCTION-SB-WEB-HELPER]
    timeout-minutes: 10
    needs: [deploy, verify]
    environment:
      name: production
    if: failure()

    steps:
      - name: Restore Previous Version
        run: |
          set -e
          echo "🔄 Initiating rollback..."

          # Find most recent backup
          LATEST_BACKUP=$(ls -dt ${{ env.DEPLOY_PATH }}.backup.* 2>/dev/null | head -n1)

          if [ -z "$LATEST_BACKUP" ]; then
            echo "❌ No backup found for rollback!"
            exit 1
          fi

          echo "📦 Restoring from: ${LATEST_BACKUP}"

          # Backup failed deployment for investigation
          if [ -d "${{ env.DEPLOY_PATH }}" ]; then
            sudo mv "${{ env.DEPLOY_PATH }}" "${{ env.DEPLOY_PATH }}.failed.$(date +%Y%m%d_%H%M%S)"
          fi

          # Restore backup
          sudo mv "${LATEST_BACKUP}" "${{ env.DEPLOY_PATH }}"

          # Restart service
          sudo systemctl restart sb-web-helper.service
          sleep 5

          if sudo systemctl is-active --quiet sb-web-helper.service; then
            echo "✅ Rollback completed successfully"
          else
            echo "❌ Rollback failed - manual intervention required!"
            exit 1
          fi

      - name: Notify Rollback
        run: |
          echo "============================================"
          echo "⚠️ DEPLOYMENT ROLLED BACK"
          echo "============================================"
          echo "Previous version has been restored"
          echo "Please investigate the deployment failure"
          echo "============================================"
