name: Production Deployment Pipeline

on:
  push:
    branches: [release/production]
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag to deploy (leave empty to deploy latest commit)"
        required: false
        type: string
      skip_tests:
        description: "Skip test execution (not recommended)"
        required: false
        type: boolean
        default: false

concurrency:
  group: production-deployment
  cancel-in-progress: false

env:
  NODE_VERSION: "20"
  BUN_VERSION: "latest"
  DEPLOY_PATH: "/var/www/sb-web-helper"
  ARTIFACT_NAME: "production-build"
  ARTIFACT_RETENTION_DAYS: 30

jobs:
  # ============================================
  # Pre-deployment Validation
  # ============================================
  pre_flight_checks:
    name: 🔍 Pre-flight Checks
    runs-on: [self-hosted, PRODUCTION-SB-WEB-HELPER]
    timeout-minutes: 5
    environment:
      name: production
    outputs:
      deployment_ref: ${{ steps.ref.outputs.ref }}
      deployment_sha: ${{ steps.ref.outputs.sha }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.ref }}

      - name: Determine Deployment Reference
        id: ref
        run: |
          echo "🔵 [DEBUG] Starting Reference Determination..."
          echo "   - Event Name: ${{ github.event_name }}"
          echo "   - Input Tag: ${{ inputs.tag }}"

          if [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ inputs.tag }}" ]; then
            echo "   - Mode: Manual Tag Deployment"
            REF="${{ inputs.tag }}"
            SHA=$(git rev-parse "refs/tags/${{ inputs.tag }}")
          else
            echo "   - Mode: Automatic/Branch Deployment"
            REF="${{ github.ref_name }}"
            SHA="${{ github.sha }}"
          fi

          echo "ref=${REF}" >> $GITHUB_OUTPUT
          echo "sha=${SHA}" >> $GITHUB_OUTPUT

          echo "✅ [RESULT] Reference Determined:"
          echo "   - Ref: ${REF}"
          echo "   - SHA: ${SHA:0:8}"

      - name: Validate Deployment Directory
        timeout-minutes: 2
        run: |
          echo "🔵 [DEBUG] Checking Deployment Path: ${{ env.DEPLOY_PATH }}"

          if [ ! -d "${{ env.DEPLOY_PATH }}" ]; then
            echo "⚠️ [WARN] Directory does not exist. Attempting to create..."
            mkdir -p "${{ env.DEPLOY_PATH }}"
            
            if [ -d "${{ env.DEPLOY_PATH }}" ]; then
               echo "✅ [SUCCESS] Directory created successfully."
            else
               echo "❌ [ERROR] Failed to create directory."
               exit 1
            fi
          else
            echo "✅ [INFO] Directory exists. Checking permissions..."
            ls -ld "${{ env.DEPLOY_PATH }}"
          fi

  # ============================================
  # Code Quality & Security
  # ============================================
  quality-gates:
    name: 🛡️ Quality & Security Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: pre_flight_checks
    if: ${{ !inputs.skip_tests }}

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.pre_flight_checks.outputs.deployment_sha }}

      - name: Install Dependencies
        run: |
          echo "🔵 [DEBUG] Installing dependencies for quality checks..."
          npm ci --prefer-offline --no-audit
          echo "✅ [SUCCESS] Dependencies installed."

      - name: Lint Code
        run: |
          echo "🔵 [DEBUG] Checking for lint script..."
          if [ -f "package.json" ] && npm run --silent | grep -q "lint"; then
            echo "📝 [ACTION] Running linter..."
            npm run lint
            echo "✅ [SUCCESS] Lint checks passed."
          else
            echo "⚠️ [SKIP] No 'lint' script found in package.json."
          fi

      - name: Run Tests
        run: |
          echo "🔵 [DEBUG] Checking for test script..."
          if [ -f "package.json" ] && npm run --silent | grep -q "test"; then
            echo "🧪 [ACTION] Running tests..."
            npm test
            echo "✅ [SUCCESS] All tests passed."
          else
            echo "⚠️ [SKIP] No 'test' script found in package.json."
          fi

      - name: Security Audit
        continue-on-error: true
        run: |
          echo "🔒 [ACTION] Running security audit (Level: High)..."
          npm audit --audit-level=high || echo "⚠️ [WARN] Security vulnerabilities detected (Non-blocking)"

  # ============================================
  # Build Application
  # ============================================
  # ============================================
  # Build Application (ย้ายไปทำบน GitHub Cloud)
  # ============================================
  build:
    name: 🔨 Build on GitHub Runner
    runs-on: ubuntu-latest # ✅ เปลี่ยนจาก self-hosted เป็น ubuntu-latest
    timeout-minutes: 30
    needs: [pre_flight_checks]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ✅ ต้องเพิ่ม Setup Node เพราะเครื่อง GitHub เป็นเครื่องเปล่า
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install Dependencies
        run: npm ci --prefer-offline --no-audit

      - name: Generate Prisma Client
        run: |
          # Generate เพื่อให้ TypeScript รู้จัก Type ตอน Build
          if [ -f "prisma/schema.prisma" ]; then npx prisma generate --schema=prisma/schema.prisma; fi
          if [ -f "prisma/timesheet/schema.prisma" ]; then npx prisma generate --schema=prisma/timesheet/schema.prisma; fi

      - name: Build Application
        run: npm run build

      # ✅ ขั้นตอนสำคัญ: อัปโหลดไฟล์ที่ Build เสร็จแล้วเก็บไว้ส่งให้เครื่อง Server
      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          retention-days: 1
          path: |
            .next
            public
            package.json
            package-lock.json
            next.config.mjs
            prisma
            generated

  # ============================================
  # Deploy to Production (ดึงไฟล์มาลงเครื่อง Server)
  # ============================================
  deploy:
    name: 🚀 Deploy to Production
    runs-on: [self-hosted, PRODUCTION-SB-WEB-HELPER]
    needs: [pre_flight_checks, build]
    environment:
      name: production
      url: https://sb-helper.schoolbright.co

    steps:
      - name: Prepare Deployment Directory
        run: |
          echo "🔧 [ACTION] Cleaning and Preparing: ${{ env.DEPLOY_PATH }}"
          sudo mkdir -p "${{ env.DEPLOY_PATH }}"
          # ลบไฟล์เก่าทิ้ง ยกเว้น .env และ node_modules (เก็บ node_modules ไว้จะได้ไม่ต้องโหลดใหม่ทั้งหมดถ้าไม่จำเป็น)
          sudo find "${{ env.DEPLOY_PATH }}" -mindepth 1 ! -name '.env' ! -name 'node_modules' -delete

      # ✅ ขั้นตอนสำคัญ: ดาวน์โหลดไฟล์ที่ Build จาก GitHub ลงมาที่ Server
      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.DEPLOY_PATH }} # โหลดลงโฟลเดอร์ปลายทางเลย

      - name: Fix Permissions & Install Prod Deps
        run: |
          cd "${{ env.DEPLOY_PATH }}"

          echo "📦 [ACTION] Installing Production Dependencies..."
          # ติดตั้งเฉพาะ dependencies ที่จำเป็นสำหรับรัน (ไม่เอา devDependencies)
          sudo npm ci --omit=dev --prefer-offline --no-audit

          echo "⚙️ [ACTION] Regenerating Prisma Client (For Server OS)..."
          # ⚠️ สำคัญ: ต้อง Generate ใหม่บน Server เพื่อให้ Binary ตรงกับ OS ของ Server (Linux/Debian)
          if [ -f "prisma/schema.prisma" ]; then sudo npx prisma generate --schema=prisma/schema.prisma; fi
          if [ -f "prisma/timesheet/schema.prisma" ]; then sudo npx prisma generate --schema=prisma/timesheet/schema.prisma; fi

          echo "🔐 [ACTION] Setting file permissions (www-data)..."
          sudo chown -R www-data:www-data "${{ env.DEPLOY_PATH }}"
          sudo chmod -R 755 "${{ env.DEPLOY_PATH }}"

      - name: Restart Service
        run: |
          echo "🔄 [ACTION] Restarting Service..."
          sudo systemctl restart sb-web-helper.service

          # รอและตรวจสอบสถานะเหมือนเดิม
          sleep 5
          if sudo systemctl is-active --quiet sb-web-helper.service; then
            echo "✅ [SUCCESS] Service is ACTIVE."
          else
            echo "❌ [ERROR] Service failed to start."
            sudo journalctl -u sb-web-helper.service -n 20 --no-pager
            exit 1
          fi
  # ============================================
  # Post-deployment Verification
  # ============================================
  verify:
    name: ✅ Post-deployment Verification
    runs-on: [self-hosted, PRODUCTION-SB-WEB-HELPER]
    timeout-minutes: 5
    needs: [deploy, pre_flight_checks]
    environment:
      name: production

    steps:
      - name: Verify Service Status
        run: |
          set -e
          echo "🔍 [ACTION] Performing Post-Deployment Verification..."

          # Check service status
          echo "   - Checking systemctl status..."
          if ! sudo systemctl is-active --quiet sb-web-helper.service; then
            echo "❌ [ERROR] Service is NOT running!"
            exit 1
          fi
          echo "   > Service is Active."

          # Check if application is responding
          echo "   - Checking HTTP Response (localhost:3000)..."
          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}\n" http://localhost:3000 || echo "FAILED")

          if [ "$HTTP_STATUS" == "200" ]; then
             echo "✅ [SUCCESS] Application responded with HTTP 200."
          else
             echo "⚠️ [WARN] Application responded with HTTP $HTTP_STATUS (Expected 200)."
          fi

          # Display service info
          echo "📊 [INFO] Service Details:"
          sudo systemctl status sb-web-helper.service --no-pager -l | head -n 15

          echo "✅ [COMPLETE] Verification passed."

      - name: Deployment Summary
        run: |
          echo "============================================"
          echo "🎉 DEPLOYMENT SUCCESSFUL"
          echo "============================================"
          echo "📍 Reference: ${{ needs.pre_flight_checks.outputs.deployment_ref }}"
          echo "🔖 Commit: ${{ needs.pre_flight_checks.outputs.deployment_sha }}"
          echo "🕐 Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "============================================"
