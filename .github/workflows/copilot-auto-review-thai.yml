name: Copilot Auto Review (Thai)

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  copilot-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: 🧩 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🤖 Copilot Review (Thai)
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            const totalAdd = files.reduce((sum, f) => sum + f.additions, 0);
            const totalDel = files.reduce((sum, f) => sum + f.deletions, 0);

            const fileList = files.length > 0
              ? files.map(f => `- \`${f.filename}\` (${f.status}) ➕${f.additions} ➖${f.deletions}`).join('\n')
              : 'ไม่มีไฟล์ที่เปลี่ยนแปลง';

            const review = [
              '## 🤖 Copilot Auto Review (ภาษาไทย)',
              '',
              `### 📂 ไฟล์ที่เปลี่ยนแปลง (${files.length} ไฟล์)`,
              fileList,
              '',
              '### 🧠 สิ่งที่ควรตรวจสอบ',
              '- ✅ ความถูกต้องของโค้ด',
              '- 🔒 ความปลอดภัย (Security)',
              '- ⚡ ประสิทธิภาพ (Performance)',
              '- 📏 มาตรฐานการเขียนโค้ด',
              '- 🛡️ การจัดการข้อผิดพลาด (Error Handling)',
              '- 📝 Comment และ Documentation',
              '- 🧪 การทดสอบ (Unit Tests)',
              '',
              '### 📊 สรุปการเปลี่ยนแปลง',
              `- 📈 บรรทัดเพิ่ม: **${totalAdd}**`,
              `- 📉 บรรทัดลบ: **${totalDel}**`,
              `- 📝 ยอดรวม: **${totalAdd + totalDel}** บรรทัด`,
              '',
              '### 👤 ผู้สร้าง PR',
              `@${pr.user.login}`,
              '',
              '---',
              '*🤖 สร้างโดยระบบ Copilot Auto Review (Thai)*'
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: review
            });

            console.log('✅ Review comment ถูกโพสต์สำเร็จ');

      - name: 🏷️ Add Review Labels
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const labels = ['🤖 copilot-reviewed', '🔍 needs-review'];
            
            const { data: repoLabels } = await github.rest.issues.listLabelsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
            });

            const existingLabels = repoLabels.map(l => l.name);
            const labelsToAdd = labels.filter(l => existingLabels.includes(l));

            if (labelsToAdd.length > 0) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: labelsToAdd
              });
              console.log(`🏷️ เพิ่ม Labels: ${labelsToAdd.join(', ')}`);
            } else {
              console.log('⚠️ ไม่พบ Labels ที่ต้องการในระบบ');
            }

      - name: 👥 Request Human Reviewers
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const allReviewers = [
              'thanatschoolbright',
              'tanakongsengwan',
              'tristanjj',
              'code0x002',
              'devyuucharawae'
            ];

            const { data: pr } = await github.rest.pulls.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
            });

            const author = pr.user.login;
            const reviewers = allReviewers.filter(r => r !== author);

            if (reviewers.length === 0) {
              console.log('⚠️ ไม่มี Reviewers ที่สามารถมอบหมายได้');
              return;
            }

            try {
              await github.rest.pulls.requestReviewers({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                reviewers
              });

              const comment = [
                '## 👥 Human Review Required',
                '',
                '**Reviewers ที่ได้รับมอบหมาย:**',
                reviewers.map(r => `- @${r}`).join('\n'),
                '',
                '⏰ กรุณา Review ภายใน **24 ชั่วโมง**',
                '',
                '---',
                '*🔔 แจ้งเตือนโดย Copilot Auto Review System*'
              ].join('\n');

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });

              console.log(`✅ มอบหมาย ${reviewers.length} reviewers สำเร็จ`);
            } catch (error) {
              console.error(`⚠️ การมอบหมาย Reviewer ล้มเหลว: ${error.message}`);
            }