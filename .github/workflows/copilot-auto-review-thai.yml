name: Copilot Auto Review (Thai)

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  copilot-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: 🧩 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🗂️ Get PR Files
        id: pr-files
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              const { data: files } = await github.rest.pulls.listFiles({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
              });

              const changedFiles = files.map(file => ({
                filename: file.filename,
                status: file.status,
                additions: file.additions,
                deletions: file.deletions,
              }));

              core.setOutput('files', JSON.stringify(changedFiles));
              console.log(`✅ พบไฟล์ทั้งหมด ${changedFiles.length} ไฟล์`);
            } catch (error) {
              core.setFailed(`❌ ไม่สามารถดึงรายการไฟล์ได้: ${error.message}`);
            }

      - name: 🤖 Copilot Review (Thai)
        uses: actions/github-script@v7
        continue-on-error: true
        env:
          FILES_JSON: ${{ steps.pr-files.outputs.files }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              const files = JSON.parse(process.env.FILES_JSON || '[]');

              const totalAdd = files.reduce((sum, f) => sum + f.additions, 0);
              const totalDel = files.reduce((sum, f) => sum + f.deletions, 0);

              const fileList = files.length > 0
                ? files.map(f => `- ${f.filename} (${f.status}) ➕${f.additions} ➖${f.deletions}`).join('\n')
                : 'ไม่มีไฟล์ที่เปลี่ยนแปลง';

              const review = [
                '## 🤖 Copilot Auto Review (ภาษาไทย)',
                '',
                `📂 **ไฟล์ที่เปลี่ยนแปลง (${files.length})**`,
                fileList,
                '',
                '🧠 **สิ่งที่ควรตรวจสอบ**',
                '- ความถูกต้องของโค้ด',
                '- ความปลอดภัย',
                '- ประสิทธิภาพ',
                '- มาตรฐานการเขียน',
                '- การจัดการข้อผิดพลาด',
                '- Comment / Documentation',
                '- การทดสอบ (Testing)',
                '',
                '📊 **สรุป**',
                `- บรรทัดเพิ่ม: ${totalAdd}`,
                `- บรรทัดลบ: ${totalDel}`,
                '',
                '---',
                '*สร้างโดยระบบ Copilot Auto Review (Thai)*'
              ].join('\n');

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: review
              });

              console.log('✅ Review comment ถูกโพสต์สำเร็จ');
            } catch (error) {
              console.error(`⚠️ Review Step ล้มเหลว: ${error.message}`);
            }

      - name: 🏷️ Add Review Labels
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: ['🤖 copilot-reviewed', '🔍 needs-review', '🇹🇭 thai-review']
              });
              console.log('🏷️ Labels ถูกเพิ่มเรียบร้อย');
            } catch (error) {
              console.error(`⚠️ เพิ่ม Labels ไม่สำเร็จ: ${error.message}`);
            }

      - name: 👥 Request Human Reviewers
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            try {
              const reviewers = [
                'thanatschoolbright',
                'tanakongsengwan',
                'tristanjj',
                'code0x002',
                'devyuucharawae'
              ];

              await github.rest.pulls.requestReviewers({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: context.issue.number,
                reviewers
              });

              const comment = [
                '## 👥 Human Review Required',
                '',
                '**Reviewers ที่ได้รับมอบหมาย:**',
                reviewers.map(r => `- @${r}`).join('\n'),
                '',
                'กรุณา Review ภายใน 24 ชม.',
                '',
                '*แจ้งเตือนโดย Copilot Auto Review System*'
              ].join('\n');

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: comment
              });

              console.log('✅ Reviewer ถูกมอบหมายเรียบร้อย');
            } catch (error) {
              console.error(`⚠️ การมอบหมาย Reviewer ล้มเหลว: ${error.message}`);
            }
