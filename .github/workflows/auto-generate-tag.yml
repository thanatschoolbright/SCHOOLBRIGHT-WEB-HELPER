name: Sync Release Notes (Auto Tag Sync)

on:
  push:
    branches:
      - "release/*"
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  release:
    types: [published, edited]

concurrency:
  group: sync-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync-release-history:
    name: 🔄 Sync All Releases to version-control.tag.json
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      SYSTEM_NAME: schoolbright-sb-web-helper
      META_REPO: Jabjai-Corporation/meta-version
      TARGET_FILE: meta-version/version-control.tag.json

    steps:
      - name: 📥 Checkout main project repo
        uses: actions/checkout@v4

      - name: 📁 Checkout meta-version repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.META_REPO }}
          token: ${{ secrets.SECRET_TOKEN }}
          path: meta-version

      - name: 📡 Fetch All Releases & Tags
        id: fetch_releases
        run: |
          echo "Fetching releases via GitHub REST API..."

          curl -L \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${{ github.repository }}/releases?per_page=100" > raw_releases.json

          if [ ! -s raw_releases.json ] || grep -q "Not Found" raw_releases.json; then
             echo "⚠️ No releases found or API error."
             echo "[]" > raw_releases.json
          fi

          COUNT=$(jq '. | length' raw_releases.json)
          echo "count=$COUNT" >> $GITHUB_OUTPUT

      - name: 🛠️ Transform Data to version-control.tag.json
        run: |
          # 1. ตรวจสอบว่ามีไฟล์ปลายทางหรือยัง ถ้าไม่มีให้สร้าง Array เปล่า
          if [ ! -f "${{ env.TARGET_FILE }}" ]; then
            echo "[]" > "${{ env.TARGET_FILE }}"
          fi

          # 2. ใช้ jq อ่านไฟล์เก่า (TARGET_FILE) และไฟล์ใหม่ (raw_releases.json) มา Merge กัน
          # --slurpfile จะอ่านไฟล์ raw_releases.json เข้ามาเป็นตัวแปร $new_releases (อยู่ในรูป array of array)
          
          jq -c \
            --arg system "${{ env.SYSTEM_NAME }}" \
            --arg update_time "$(date -Iseconds)" \
            --slurpfile new_releases raw_releases.json \
            '
            # ส่วนที่ 1: กรองข้อมูลเก่าในไฟล์เดิม (Input คือไฟล์ TARGET_FILE)
            # เก็บไว้เฉพาะ object ที่ system ไม่ตรงกับ system ปัจจุบัน (เพื่อ replace ของเก่าทิ้ง)
            map(select(.system != $system))
            +
            # ส่วนที่ 2: แปลงข้อมูลใหม่จาก raw_releases (index 0 เพราะ slurpfile ห่อมาชั้นนึง)
            ($new_releases[0] | map({
              system: $system,
              tag: (.tag_name | sub("^v"; "")), 
              title: (.name // (.tag_name | sub("^v"; ""))),
              release_date: .published_at,
              type: (if .prerelease then "beta" else "production" end),
              notes: (.body // ""),
              author: (.author.login // "unknown"),
              synced_at: $update_time
            }))
            # ส่วนที่ 3: รวมกันแล้ว sort ตามวันที่ใหม่สุดไปเก่าสุด
            | sort_by(.release_date) | reverse
            ' "${{ env.TARGET_FILE }}" > temp.json

          # 3. ย้ายไฟล์ temp กลับไปเป็นไฟล์จริง
          mv temp.json "${{ env.TARGET_FILE }}"

      - name: 🚀 Commit and Push
        id: deploy
        run: |
          cd meta-version
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add version-control.tag.json

          if git diff --staged --quiet; then
            echo "status=no_changes" >> $GITHUB_OUTPUT
          else
            git commit -m "Docs: Update release history for ${{ env.SYSTEM_NAME }}"
            git pull --rebase origin main
            git push origin main
            echo "status=success" >> $GITHUB_OUTPUT
          fi

      # ------------------------------------------------------------------
      # ✨ Job Summary Section
      # ------------------------------------------------------------------
      - name: 📝 Write Job Summary
        if: always()
        run: |
          if [[ "${{ steps.deploy.outputs.status }}" == "success" ]]; then
            STATUS_EMOJI="✅"
            STATUS_MSG="Sync Completed (Updated)"
          elif [[ "${{ steps.deploy.outputs.status }}" == "no_changes" ]]; then
            STATUS_EMOJI="⚠️"
            STATUS_MSG="Skipped (No Changes)"
          else
            STATUS_EMOJI="❌"
            STATUS_MSG="Failed (Check Logs)"
          fi

          LATEST_TAG="N/A"
          LATEST_DATE="N/A"
          # ดึงข้อมูลล่าสุดของ System นี้มาโชว์ (ต้อง Filter หาเฉพาะ System นี้ก่อนเลือกตัวแรก)
          if [ -f "${{ env.TARGET_FILE }}" ]; then
            LATEST_TAG=$(jq -r --arg system "${{ env.SYSTEM_NAME }}" 'map(select(.system == $system)) | .[0].tag // "N/A"' "${{ env.TARGET_FILE }}")
            LATEST_DATE=$(jq -r --arg system "${{ env.SYSTEM_NAME }}" 'map(select(.system == $system)) | .[0].release_date // "N/A"' "${{ env.TARGET_FILE }}")
          fi

          echo "### 🚀 Release Sync Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> **Status:** $STATUS_EMOJI $STATUS_MSG" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "| 📋 Metric | ℹ️ Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **System Name** | \`${{ env.SYSTEM_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Total Releases** | ${{ steps.fetch_releases.outputs.count }} items |" >> $GITHUB_STEP_SUMMARY
          echo "| **Latest Tag** | \`$LATEST_TAG\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Latest Date** | $LATEST_DATE |" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "<details><summary>🔍 Preview Latest Release Data (JSON)</summary>" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`json" >> $GITHUB_STEP_SUMMARY
          if [ -f "${{ env.TARGET_FILE }}" ]; then
            jq --arg system "${{ env.SYSTEM_NAME }}" 'map(select(.system == $system)) | .[0]' "${{ env.TARGET_FILE }}" >> $GITHUB_STEP_SUMMARY
          else
            echo "File not found." >> $GITHUB_STEP_SUMMARY
          fi
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          echo "</details>" >> $GITHUB_STEP_SUMMARY