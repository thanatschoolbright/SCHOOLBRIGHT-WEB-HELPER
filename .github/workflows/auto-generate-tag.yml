name: Sync Release Notes (Auto Tag Sync)

on:
  push:
    branches:
      - "release/*"
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  release:
    types: [published, edited]

concurrency:
  group: sync-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync-release-history:
    name: 🔄 Sync All Releases to sb-api-mobile.tag.json
    runs-on: ubuntu-latest
    timeout-minutes: 10 # เพิ่มเวลาเผื่อกรณีมี Release เยอะมาก

    env:
      SYSTEM_NAME: schoolbright-sb-web-helper
      META_REPO: Jabjai-Corporation/meta-version
      TARGET_FILE: meta-version/sb-api-mobile.tag.json
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # จำเป็นสำหรับ gh api

    steps:
      - name: 📥 Checkout main project repo
        uses: actions/checkout@v4

      - name: 📁 Checkout meta-version repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.META_REPO }}
          token: ${{ secrets.SECRET_TOKEN }}
          path: meta-version

      # ------------------------------------------------------------------
      # 📡 แก้ไข: ใช้ gh api --paginate เพื่อดึงข้อมูล "ทั้งหมด" ไม่จำกัดแค่ 100
      # ------------------------------------------------------------------
      - name: 📡 Fetch Full History (All Pages)
        id: fetch_releases
        run: |
          echo "Fetching ALL releases history (Pagination enabled)..."

          # ใช้ gh api พร้อม flag --paginate เพื่อดึงข้อมูลทุกหน้ามารวมกัน
          # และใช้ jq ในตัว (flag -q) เลือกเฉพาะ field ที่จำเป็นเพื่อลดขนาดไฟล์
          gh api "repos/${{ github.repository }}/releases" \
            --paginate \
            -q 'map({tag_name, name, published_at, body, prerelease, author: .author.login})' \
            > raw_releases.json

          # ตรวจสอบความถูกต้อง
          if [ ! -s raw_releases.json ]; then
             echo "[]" > raw_releases.json
          fi

          COUNT=$(jq length raw_releases.json)
          echo "count=$COUNT" >> $GITHUB_OUTPUT
          echo "✅ Fetched $COUNT releases in total."

      # ------------------------------------------------------------------
      # 🛠️ Transform & Update Data (Wipe & Replace Current System)
      # ------------------------------------------------------------------
      - name: 🛠️ Transform & Update Data
        id: merge_data
        run: |
          # 1. สร้างไฟล์ Target หากยังไม่มี
          if [ ! -f "${{ env.TARGET_FILE }}" ] || [ ! -s "${{ env.TARGET_FILE }}" ]; then
            echo "[]" > "${{ env.TARGET_FILE }}"
          fi

          # 2. สร้างไฟล์ Raw หากยังไม่มี
          if [ ! -s "raw_releases.json" ]; then
            echo "[]" > "raw_releases.json"
          fi

          # 3. JQ Logic:
          # - existing_db: ข้อมูลเดิมทั้งหมดในไฟล์
          # - raw_input: ข้อมูล Release ทั้งหมด (จากอดีต-ปัจจุบัน) ที่เพิ่งดึงมา
          # Logic: ลบข้อมูลของ System นี้อันเก่าทิ้งทั้งหมด แล้วแทนที่ด้วยข้อมูลชุดใหญ่ที่เพิ่งดึงมา

          jq -c \
            --slurpfile existing_db "${{ env.TARGET_FILE }}" \
            --slurpfile raw_input "raw_releases.json" \
            --arg sys "${{ env.SYSTEM_NAME }}" \
            --arg update_time "$(date -Iseconds)" \
            '
            # (A) แปลงข้อมูลชุดใหม่ (ดึงมาครบทุกตัวจาก GitHub)
            ($raw_input[0] | map({
              system: $sys,
              tag: (.tag_name | sub("^v"; "")), 
              title: (.name // (.tag_name | sub("^v"; ""))),
              release_date: .published_at,
              type: (if .prerelease then "beta" else "production" end),
              notes: (.body // ""),
              author: (.author // "unknown"),
              synced_at: $update_time
            })) as $new_history |

            # (B) กรองข้อมูลในไฟล์เก่า: เก็บไว้เฉพาะ System "อื่น"
            ($existing_db[0] | map(select(.system != $sys))) as $other_systems |

            # (C) เอาของคนอื่น + ของเรา(ประวัติทั้งหมด) มารวมกัน
            ($other_systems + $new_history) |
            
            # (D) เรียงลำดับ (ใหม่ -> เก่า)
            sort_by(.release_date) | reverse
            ' > "${{ env.TARGET_FILE }}.tmp" && mv "${{ env.TARGET_FILE }}.tmp" "${{ env.TARGET_FILE }}"

          echo "✅ Database updated. Total items in file: $(jq length "${{ env.TARGET_FILE }}")"

      - name: 🚀 Commit and Push
        id: deploy
        run: |
          cd meta-version
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add sb-api-mobile.tag.json

          if git diff --staged --quiet; then
            echo "status=no_changes" >> $GITHUB_OUTPUT
            echo "⚠️ No changes in release history."
          else
            git commit -m "Docs: Update full release history for ${{ env.SYSTEM_NAME }}"
            git pull --rebase origin main
            git push origin main
            echo "status=success" >> $GITHUB_OUTPUT
          fi

      - name: 📝 Write Job Summary
        if: always()
        run: |
          if [[ "${{ steps.deploy.outputs.status }}" == "success" ]]; then
            STATUS_EMOJI="✅"
            STATUS_MSG="Sync Completed (Database Updated)"
          elif [[ "${{ steps.deploy.outputs.status }}" == "no_changes" ]]; then
            STATUS_EMOJI="✨"
            STATUS_MSG="Up-to-date (No changes needed)"
          else
            STATUS_EMOJI="❌"
            STATUS_MSG="Failed (Check Logs)"
          fi

          LATEST_TAG="N/A"
          if [ -f "${{ env.TARGET_FILE }}" ]; then
            LATEST_TAG=$(jq -r '.[0].tag // "N/A"' "${{ env.TARGET_FILE }}")
            TOTAL_ITEMS=$(jq length "${{ env.TARGET_FILE }}")
          fi

          echo "### 🚀 Release History DB Status" >> $GITHUB_STEP_SUMMARY
          echo "> **Status:** $STATUS_EMOJI $STATUS_MSG" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **Total Records (All Systems)** | $TOTAL_ITEMS items |" >> $GITHUB_STEP_SUMMARY
          echo "| **Fetched (Current System)** | ${{ steps.fetch_releases.outputs.count }} releases (All History) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Latest Tag** | \`$LATEST_TAG\` |" >> $GITHUB_STEP_SUMMARY
