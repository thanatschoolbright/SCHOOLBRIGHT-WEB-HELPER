name: Sync Release Notes (Auto Tag Sync)

on:
  push:
    branches:
      - "release/*"
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"
  release:
    types: [published, edited]

concurrency:
  group: sync-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync-release-history:
    name: 🔄 Sync All Releases to sb-api-mobile.tag.json
    runs-on: ubuntu-latest
    timeout-minutes: 10 # เพิ่มเวลาเล็กน้อยเผื่อดึงข้อมูลเยอะ

    env:
      SYSTEM_NAME: schoolbright-sb-web-helper
      META_REPO: Jabjai-Corporation/meta-version
      TARGET_FILE: meta-version/sb-api-mobile.tag.json
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }} # จำเป็นสำหรับ gh api

    steps:
      - name: 📥 Checkout main project repo
        uses: actions/checkout@v4

      - name: 📁 Checkout meta-version repo
        uses: actions/checkout@v4
        with:
          repository: ${{ env.META_REPO }}
          token: ${{ secrets.SECRET_TOKEN }}
          path: meta-version

      # ------------------------------------------------------------------
      # 1. Fetch: เปลี่ยนเป็น gh api --paginate เพื่อให้ได้ "ทุก Tag" ในประวัติ
      # (จำเป็นต้องใช้แบบนี้ เพราะถ้าเราจะลบของเก่าทิ้ง เราต้องมั่นใจว่าของใหม่มีครบ)
      # ------------------------------------------------------------------
      - name: 📡 Fetch Full History
        id: fetch_releases
        run: |
          echo "Fetching ALL releases history..."

          # ใช้ gh api ดึงข้อมูลทุกหน้า (Pagination)
          gh api "repos/${{ github.repository }}/releases" \
            --paginate \
            -q 'map({tag_name, name, published_at, body, prerelease, author: .author.login})' \
            > raw_releases.json

          # ป้องกันไฟล์ว่าง
          if [ ! -s raw_releases.json ]; then echo "[]" > raw_releases.json; fi

          COUNT=$(jq length raw_releases.json)
          echo "count=$COUNT" >> $GITHUB_OUTPUT

      # ------------------------------------------------------------------
      # 2. Transform: Logic ลบเฉพาะ System ปัจจุบัน แล้วแทนที่ใหม่
      # ------------------------------------------------------------------
      - name: 🛠️ Transform & Merge Data (Keep Others, Replace Current)
        run: |
          # สร้างไฟล์เปล่าถ้ายังไม่มี (ป้องกัน Error)
          if [ ! -f "${{ env.TARGET_FILE }}" ] || [ ! -s "${{ env.TARGET_FILE }}" ]; then
            echo "[]" > "${{ env.TARGET_FILE }}"
          fi

          # JQ Logic:
          # 1. อ่านข้อมูลใหม่ ($raw_input)
          # 2. อ่านข้อมูลเก่า ($existing_db)
          # 3. กรองของเก่า: เก็บไว้เฉพาะ System ที่ "ไม่ใช่" ตัวปัจจุบัน (Keep Others)
          # 4. รวมร่าง: (Others) + (New Current Data)

          jq -c \
            --slurpfile existing_db "${{ env.TARGET_FILE }}" \
            --slurpfile raw_input "raw_releases.json" \
            --arg sys "${{ env.SYSTEM_NAME }}" \
            --arg update_time "$(date -Iseconds)" \
            '
            # (A) แปลงข้อมูลชุดใหม่ (New Data)
            ($raw_input[0] | map({
              system: $sys,
              tag: (.tag_name | sub("^v"; "")), 
              title: (.name // (.tag_name | sub("^v"; ""))),
              release_date: .published_at,
              type: (if .prerelease then "beta" else "production" end),
              notes: (.body // ""),
              author: (.author // "unknown"),
              synced_at: $update_time
            })) as $new_data |

            # (B) กรองข้อมูลเก่า: เลือกเฉพาะที่ไม่ใช่ System นี้ (Keep Others)
            ($existing_db[0] | map(select(.system != $sys))) as $other_systems |

            # (C) นำมารวมกัน
            ($other_systems + $new_data) |
            
            # (D) จัดเรียงใหม่
            sort_by(.release_date) | reverse
            ' > "${{ env.TARGET_FILE }}.tmp" && mv "${{ env.TARGET_FILE }}.tmp" "${{ env.TARGET_FILE }}"

          echo "✅ Database updated. Total items: $(jq length "${{ env.TARGET_FILE }}")"

      - name: 🚀 Commit and Push
        id: deploy
        run: |
          cd meta-version
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add sb-api-mobile.tag.json

          if git diff --staged --quiet; then
            echo "status=no_changes" >> $GITHUB_OUTPUT
            echo "⚠️ No changes detected."
          else
            git commit -m "Docs: Update release history for ${{ env.SYSTEM_NAME }}"
            git pull --rebase origin main
            git push origin main
            echo "status=success" >> $GITHUB_OUTPUT
          fi

      # ------------------------------------------------------------------
      # ✨ Job Summary
      # ------------------------------------------------------------------
      - name: 📝 Write Job Summary
        if: always()
        run: |
          if [[ "${{ steps.deploy.outputs.status }}" == "success" ]]; then
            STATUS_EMOJI="✅"
            STATUS_MSG="Sync Completed (Updated)"
          elif [[ "${{ steps.deploy.outputs.status }}" == "no_changes" ]]; then
            STATUS_EMOJI="⚠️"
            STATUS_MSG="Skipped (No Changes)"
          else
            STATUS_EMOJI="❌"
            STATUS_MSG="Failed (Check Logs)"
          fi

          LATEST_TAG="N/A"
          LATEST_DATE="N/A"
          TOTAL_ITEMS="0"

          if [ -f "${{ env.TARGET_FILE }}" ]; then
            LATEST_TAG=$(jq -r '.[0].tag // "N/A"' "${{ env.TARGET_FILE }}")
            LATEST_DATE=$(jq -r '.[0].release_date // "N/A"' "${{ env.TARGET_FILE }}")
            TOTAL_ITEMS=$(jq length "${{ env.TARGET_FILE }}")
          fi

          echo "### 🚀 Release Sync Status" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "> **Status:** $STATUS_EMOJI $STATUS_MSG" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "| 📋 Metric | ℹ️ Value |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| **System Name** | \`${{ env.SYSTEM_NAME }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Fetched (Current)** | ${{ steps.fetch_releases.outputs.count }} releases |" >> $GITHUB_STEP_SUMMARY
          echo "| **Total in DB** | $TOTAL_ITEMS items (All systems) |" >> $GITHUB_STEP_SUMMARY
          echo "| **Latest Tag** | \`$LATEST_TAG\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Latest Date** | $LATEST_DATE |" >> $GITHUB_STEP_SUMMARY
