name: Device Monitoring - Multi-Channel Status Report

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  schedule:
    - cron: "0,5,10,15,20,25,30,35,40,45,50,55 * * * *"

  workflow_dispatch:

jobs:
  send-reports:
    name: Send Device Status Reports
    runs-on: ubuntu-latest

    steps:
      - name: Send Device Status Report to LINE
        id: line_report
        continue-on-error: true
        run: |
          echo "Sending device status report to LINE..."
          response=$(curl -s -o /tmp/line_response.txt -w "%{http_code}" \
            -X GET \
            "https://sb-helper.schoolbright.co/api/v1/hardware/machine-monitoring/channel/line")

          body=$(cat /tmp/line_response.txt)
          echo "HTTP Status: $response"
          echo "Response: $body"

          if [ "$response" -eq 200 ]; then
            echo "LINE report sent successfully"
            exit 0
          else
            echo "Failed to send LINE report (status: $response)"
            exit 1
          fi

      - name: Send Device Status Alert to Discord
        id: discord_report
        continue-on-error: true
        run: |
          echo "Sending device status alert to Discord..."
          response=$(curl -s -o /tmp/discord_response.txt -w "%{http_code}" \
            -X GET \
            "https://sb-helper.schoolbright.co/api/v1/hardware/machine-monitoring/channel/discord")

          body=$(cat /tmp/discord_response.txt)
          echo "HTTP Status: $response"
          echo "Response: $body"

          if [ "$response" -eq 200 ]; then
            echo "Discord alert sent successfully"
            exit 0
          else
            echo "Failed to send Discord alert (status: $response)"
            exit 1
          fi

      - name: Send Device Status Report via Email
        id: email_report
        continue-on-error: true
        run: |
          echo "Sending device status report via email..."
          response=$(curl -s -o /tmp/email_response.txt -w "%{http_code}" \
            -X GET \
            "https://sb-helper.schoolbright.co/api/v1/hardware/machine-monitoring/channel/email")

          body=$(cat /tmp/email_response.txt)
          echo "HTTP Status: $response"
          echo "Response: $body"

          if [ "$response" -eq 200 ]; then
            echo "Email report sent successfully"
            exit 0
          else
            echo "Failed to send email report (status: $response)"
            exit 1
          fi

      - name: Generate Workflow Summary
        if: always()
        run: |
          echo "### 📊 Multi-Channel Report Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Channel | Status | Outcome |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :---: | :--- |" >> $GITHUB_STEP_SUMMARY
          
          # LINE
          if [ "${{ steps.line_report.outcome }}" == "success" ]; then
            echo "| 💬 LINE | ✅ | Success |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 💬 LINE | ❌ | Failed |" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Discord
          if [ "${{ steps.discord_report.outcome }}" == "success" ]; then
            echo "| 🎮 Discord | ✅ | Success |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 🎮 Discord | ❌ | Failed |" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Email
          if [ "${{ steps.email_report.outcome }}" == "success" ]; then
            echo "| 📧 Email | ✅ | Success |" >> $GITHUB_STEP_SUMMARY
          else
            echo "| 📧 Email | ❌ | Failed |" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Executed at: \`$(date)\`" >> $GITHUB_STEP_SUMMARY

      - name: Log timestamp
        if: always()
        run: |
          echo "Executed at: $(date)"
          echo "Timezone: $(date +%Z)"
